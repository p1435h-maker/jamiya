<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جمعية البيت</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D6655">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* الفكرة: دفتر حسابات عائلي أخضر داكن بلمسة ذهبية؛ الجوال أولاً، شريط تنقل سفلي، وعلى الكمبيوتر عمود جانبي */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#15242A; --muted:#5D6B6F; --line:#DCE3DE;
  --accent:#0D6655; --accent-ink:#FFFFFF; --accent-soft:#E0EFEA; --gold:#B5832A; --gold-soft:#F6EBD5;
  --pos:#1D7A47; --pos-soft:#E1F2E7; --neg:#B23A30; --neg-soft:#F8E4E1;
  --font-display:"Reem Kufi","Readex Pro",Tahoma,sans-serif;
  --font-body:"Readex Pro",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(15,40,35,.06),0 6px 20px rgba(15,40,35,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162126; --surface-2:#1B282D; --ink:#E5EEEC; --muted:#93A4A6; --line:#26373C;
  --accent:#3DB59D; --accent-ink:#06231D; --accent-soft:#163C35; --gold:#E2B262; --gold-soft:#3A2F1A;
  --pos:#5DCB8B; --pos-soft:#173726; --neg:#F07D72; --neg-soft:#3F1F1C; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162126; --surface-2:#1B282D; --ink:#E5EEEC; --muted:#93A4A6; --line:#26373C;
  --accent:#3DB59D; --accent-ink:#06231D; --accent-soft:#163C35; --gold:#E2B262; --gold-soft:#3A2F1A;
  --pos:#5DCB8B; --pos-soft:#173726; --neg:#F07D72; --neg-soft:#3F1F1C; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15.5px}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;max-width:1100px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:19px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--gold)}
main{max-width:1100px;margin:0 auto;width:100%;padding:8px 16px 110px;display:grid;gap:14px;align-content:start}

nav.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;padding:6px 2px;border-radius:10px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr}
  nav.tabs{position:sticky;top:0;height:100vh;grid-template-columns:1fr;align-content:start;border-top:0;border-inline-start:1px solid var(--line);padding:80px 12px 12px;gap:4px;inset:auto}
  nav.tabs a{flex-direction:row;gap:10px;font-size:14.5px;padding:10px 12px;justify-content:flex-start}
  .top{grid-column:2} main{grid-column:2;padding-bottom:40px}
  nav.tabs{grid-row:1 / span 2;grid-column:1}
  .fab{bottom:28px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1.1fr 1fr}}

.hero{background:var(--accent);color:var(--accent-ink);border:0;position:relative;overflow:hidden}
.hero .lbl{opacity:.85;font-size:13.5px}
.hero .big{font-family:var(--font-display);font-size:40px;line-height:1.1;margin:4px 0 2px}
.hero .cur{font-size:15px;opacity:.85;margin-inline-start:6px;font-family:var(--font-body)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-stats div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
:root[data-theme="dark"] .hero-stats div{background:rgba(0,0,0,.14)}
.hero-stats b{display:block;font-size:16px;font-weight:600}
.hero-stats span{font-size:11.5px;opacity:.85}
:root[data-theme="dark"] .hero{background:linear-gradient(160deg,#17493F,#0F2E28);color:#E8F2EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(160deg,#17493F,#0F2E28);color:#E8F2EF}}
:root[data-theme="dark"] .av{filter:brightness(1.7) saturate(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{filter:brightness(1.7) saturate(.9)}}
.hero .pattern{position:absolute;inset-inline-start:-30px;top:-30px;width:170px;height:170px;opacity:.12;pointer-events:none}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.zero{background:var(--surface-2);color:var(--muted)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.mlist{display:grid;gap:2px}
.mrow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;text-decoration:none;color:inherit}
.mrow:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:16px;background:var(--surface-2);color:var(--accent);border:1px solid var(--line)}
.mrow .bar{height:4px;border-radius:4px;background:var(--surface-2);margin-top:5px;position:relative;overflow:hidden}
.mrow .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.amt{font-weight:600;text-align:end}
.amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chips-wrap{flex-wrap:wrap;overflow:visible}
.chips-wrap .chip{padding:6px 12px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip svg{width:13px;height:13px}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.flow{grid-template-columns:repeat(2,1fr)}}
.flow div{background:var(--surface-2);border-radius:10px;padding:10px}
.flow span{font-size:12px;color:var(--muted);display:block}
.flow b{font-size:17px;font-weight:600}
.flow .end{background:var(--accent-soft)} .flow .end b{color:var(--accent)}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--surface)}
.q .st{font-size:12px}
.q .pill{white-space:normal}
.q button{justify-self:start}
.qbtn{text-align:start;cursor:pointer;font:inherit;color:inherit}
.qbtn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.qbtn:disabled{cursor:default}

.btn{border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.danger{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.txl{display:grid}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface-2)}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.k-deposit .ic,.k-external .ic{background:var(--pos-soft);color:var(--pos)}
.k-expense .ic{background:var(--neg-soft);color:var(--neg)}
.k-payout .ic{background:var(--gold-soft);color:var(--gold)}
.k-onbehalf .ic,.k-adjust .ic{background:var(--accent-soft);color:var(--accent)}
.tx .t1{font-weight:500}
.tx .t2{font-size:12.5px;color:var(--muted)}
.plus{color:var(--pos)} .minus{color:var(--neg)} .neutral{color:var(--accent)}
.sec-t{font-size:12.5px;color:var(--muted);font-weight:500;padding:12px 4px 2px;display:flex;justify-content:space-between}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 8px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-bottom:0}

.fab{position:fixed;bottom:84px;inset-inline-start:auto;inset-inline-end:18px;z-index:25;border-radius:16px;padding:14px 20px;box-shadow:0 8px 24px rgba(13,102,85,.35);font-size:15.5px}
@media (min-width:900px){.fab{inset-inline-end:32px}}

.overlay{position:fixed;inset:0;background:rgba(8,20,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.x{background:var(--surface-2);border:0;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);cursor:pointer;text-align:start;display:grid;gap:4px}
.kind b{font-weight:600;font-size:14px}
.kind span{font-size:12px;color:var(--muted)}
.kind[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kind .ic{margin-bottom:2px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;width:100%;color:var(--ink)}
input.amount{font-size:26px;font-weight:600;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.note{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.bad{background:var(--neg-soft)} .note.good{background:var(--pos-soft)}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}

.barchart{display:grid;gap:9px}
.bc{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13.5px}
.bc .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bc .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bc:first-child .track i{background:var(--gold)}
svg.line text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:4px}
.lock svg{width:13px;height:13px}
.formula{font-size:12.5px;color:var(--muted);line-height:1.9}
.formula b{color:var(--ink);font-weight:500}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.mcards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mcard .hd{display:flex;align-items:center;gap:8px}
.mcard .hdn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mbtn{background:var(--accent-soft);color:var(--accent);border-color:transparent;white-space:nowrap;padding:4px 10px;font-size:12.5px}
.mbtn:hover{background:var(--accent);color:var(--accent-ink)}
@media (max-width:400px){.mbtn{padding:3px 8px;font-size:11.5px}}
.mnote{font-size:12px;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:3px 8px;justify-self:start}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">ج</div><div><h1>جمعية البيت <span class="pill acc" title="رقم الإصدار" style="font-family:var(--font-body);font-size:12px;vertical-align:middle">إصدار 14</span></h1><div class="sync" id="sync"><span class="dot"></span><span>جارٍ الاتصال…</span></div></div></div>
    <button class="btn sm" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">الوضع الليلي</button>
  </header>
  <main id="view"><div class="card empty">جارٍ تحميل بيانات الجمعية…</div></main>
</div>
<button class="btn pri fab" id="fab" type="button" hidden>+ مصروف أو دخل للجمعية</button>
<div id="modal"></div>

<script>
// ===== محرك الحسابات (نفس قواعد ملف الإكسل) =====
// رصيد العضو الجديد = الرصيد السابق − القطة + ما حوّله للحساب + ما دفعه نيابة عن الجمعية − ما استلمه من الحساب ± التسويات
// رصيد الحساب الجديد = الباقي السابق + تحويلات الأعضاء + الدخل الخارجي − المصروفات − ما حُوّل للأعضاء
var KINDS = {
  deposit:  { acc: +1, mem: +1, needsMember: true },
  external: { acc: +1, mem: 0,  needsMember: false },
  expense:  { acc: -1, mem: 0,  needsMember: false },
  payout:   { acc: -1, mem: -1, needsMember: true },
  onbehalf: { acc: 0,  mem: +1, needsMember: true },
  adjust:   { acc: 0,  mem: +1, needsMember: true },
  accadj:   { acc: +1, mem: 0,  needsMember: false }
};
function r2(x){ return Math.round((+x || 0) * 100) / 100; }
function monthAfter(id){
  var y = +id.slice(0,4), m = +id.slice(5,7) + 1;
  if (m > 12) { m = 1; y++; }
  return y + '-' + (m < 10 ? '0' : '') + m;
}
// حالة العضو في شهر معيّن: none قبل الانضمام، ثم active / frozen / ended حسب آخر حدث
function memberStatusAt(m, monthId){
  if (m.joined && monthId < m.joined) return 'none';
  var st = 'active', at = '';
  (m.events || []).forEach(function(e){ if (e.from <= monthId && e.from >= at) { st = e.status; at = e.from; } });
  if (!m.events && m.active === false) st = 'frozen';
  return st;
}
// القطة: استثناء الشهر إن وُجد، وإلا القطة الافتراضية السارية من ذلك الشهر
function defaultQAt(config, monthId){
  var h = (config && config.qHistory) || [];
  if (!h.length) return null;
  var s = h.slice().sort(function(a,b){ return a.from < b.from ? -1 : 1; }), v = +s[0].amount || 0;
  s.forEach(function(x){ if (x.from <= monthId) v = +x.amount || 0; });
  return v;
}
function contributionOf(config, mo){
  if (!mo) return 0;
  if (mo.qOverride != null && mo.qOverride !== '') return +mo.qOverride || 0;
  var d = defaultQAt(config, mo.id);
  return d != null ? d : (+mo.contribution || 0);
}
function compute(config, months, txs){
  config = config || {};
  var members = config.members || [];
  var ms = months.slice().sort(function(a,b){ return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
  var acc = +((config.opening || {}).account || 0);
  var bal = {};
  var ob = (config.opening || {}).balances || {};
  var started = {};
  members.forEach(function(m){ bal[m.id] = +(ob[m.id] != null ? ob[m.id] : (m.openBal || 0)); });
  var byMonth = {};
  txs.forEach(function(t){ (byMonth[t.month] = byMonth[t.month] || []).push(t); });
  var out = [];
  var ancs = (config.anchors || []).concat(config.anchor ? [config.anchor] : []);
  ms.forEach(function(mo, mi){
    var anchorDiff = null;
    var anc = ancs.filter(function(x){ return x && x.month === mo.id; })[0];
    if (anc) {
      if (mi > 0) {
        anchorDiff = { account: r2(acc - (+anc.account || 0)), balances: {} };
        Object.keys(anc.balances || {}).forEach(function(id){ var d = r2((bal[id] || 0) - (+anc.balances[id] || 0)); if (Math.abs(d) > 0.005) anchorDiff.balances[id] = d; });
      }
      acc = +anc.account || 0;
      Object.keys(anc.balances || {}).forEach(function(id){ bal[id] = +anc.balances[id] || 0; });
    }
    var q = contributionOf(config, mo);
    var list = (byMonth[mo.id] || []).slice().sort(function(a,b){ return (a.seq||0) - (b.seq||0); });
    var r = { id: mo.id, month: mo, openAcc: r2(acc), dep: 0, ext: 0, exp: 0, pay: 0, accAdj: 0, per: {}, tx: list, byCat: {}, anchorDiff: anchorDiff };
    var exempt = mo.exempt || [];
    members.forEach(function(m){
      var st = memberStatusAt(m, mo.id);
      if (st === 'none') return;
      var charged = st === 'active' && exempt.indexOf(m.id) < 0;
      r.per[m.id] = { open: r2(bal[m.id] || 0), contrib: charged ? q : 0, dep: 0, onb: 0, pay: 0, adj: 0, status: st };
    });
    list.forEach(function(t){
      var a = +t.amount || 0, k = KINDS[t.kind];
      if (!k) return;
      var p = null;
      if (k.needsMember) {
        if (!r.per[t.member]) r.per[t.member] = { open: r2(bal[t.member] || 0), contrib: 0, dep: 0, onb: 0, pay: 0, adj: 0 };
        p = r.per[t.member];
      }
      if (t.kind === 'deposit') { r.dep += a; p.dep += a; }
      else if (t.kind === 'external') { r.ext += a; }
      else if (t.kind === 'expense') { r.exp += a; var c = t.category || 'أخرى'; r.byCat[c] = (r.byCat[c] || 0) + a; }
      else if (t.kind === 'payout') { r.pay += a; p.pay += a; }

function lineChart(pts){
  if(pts.length<2) return '<div class="empty">يظهر الرسم بعد شهرين</div>';
  var W=640,H=220,pl=46,pr=30,pt=16,pb=28;
  var vals=pts.map(function(p){return p.v;});var mn=Math.min(0,Math.min.apply(null,vals)),mx=Math.max.apply(null,vals);
  var step=Math.pow(10,Math.floor(Math.log10(Math.max(1,mx-mn))));var top=Math.ceil(mx/step)*step||1;mn=Math.floor(mn/step)*step;
  var x=function(i){return pl+(W-pl-pr)*i/(pts.length-1);},y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/(top-mn));};
  var grid='';for(var g=0;g<=4;g++){var gv=mn+(top-mn)*g/4;grid+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(gv)+'" y2="'+y(gv)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(gv)+4)+'" text-anchor="end">'+(gv>=1000?Math.round(gv/1000)+'k':Math.round(gv))+'</text>';}
  var d=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1);}).join(' ');
  var area=d+' L'+x(pts.length-1)+' '+y(mn)+' L'+x(0)+' '+y(mn)+' Z';
  var labels=pts.map(function(p,i){return '<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.l)+'</text>';}).join('');
  var li=pts.length-1;
  return '<svg class="line" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;direction:ltr" role="img" aria-label="رصيد الحساب آخر كل شهر"><g>'+grid+'</g><path d="'+area+'" fill="var(--accent)" opacity=".10"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
  pts.map(function(p,i){return '<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(i===li?5:3)+'" fill="'+(i===li?'var(--gold)':'var(--accent)')+'"><title>'+esc(p.l)+': '+fmt(p.v)+'</title></circle>';}).join('')+
  '<text x="'+x(li)+'" y="'+(y(pts[li].v)-10)+'" text-anchor="end" style="fill:var(--ink);font-weight:600">'+fmt(pts[li].v)+'</text>'+labels+'</svg>';
}

function openSheet(html,onBind){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  document.getElementById('ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSheet();});
  m.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closeSheet);});
  if(onBind)onBind(m);
  var f=m.querySelector('input.amount,input,button');if(f&&window.innerWidth>700)f.focus();
}
function closeSheet(){document.getElementById('modal').innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}

function entrySheet(existing,preset,onDone){
  var done=function(){if(onDone)onDone();else closeSheet();};
  var t=existing?Object.assign({},existing):Object.assign({kind:null,amount:'',note:'',month:S.sel},preset||{});
  var locked=isLocked(t.month);
  var ro=locked||!S.canWrite;
  function draw(){
    var k=KINDS[t.kind]||{};
    var kinds=((existing||preset)?['deposit','expense','payout','onbehalf','external']:['expense','external']).concat(t.kind==='adjust'?['adjust']:[]).concat(t.kind==='accadj'?['accadj']:[]).map(function(kk){
      return '<button type="button" class="kind k-'+kk+'" data-kind="'+kk+'" aria-pressed="'+(t.kind===kk)+'"'+(ro?' disabled':'')+'><span class="ic">'+svg(kk)+'</span><b>'+KTXT[kk].t+'</b><span>'+KTXT[kk].s+'</span></button>';
    }).join('');
    var mems=k.needsMember?'<div><div class="small muted" style="margin-bottom:6px">العضو</div><div class="chips" style="flex-wrap:wrap">'+(S.config.members||[]).filter(function(m){var s=memberStatusAt(m,t.month);return s==='active'||s==='frozen'||m.id===t.member;}).map(function(m){return '<button type="button" class="chip" data-mem="'+esc(m.id)+'" aria-pressed="'+(t.member===m.id)+'"'+(ro?' disabled':'')+'>'+esc(m.name)+'</button>';}).join('')+'</div></div>':'';
    var cats=t.kind==='expense'?'<div><div class="small muted" style="margin-bottom:6px">البند</div><div class="chips" style="flex-wrap:wrap">'+(S.config.categories||[]).map(function(c){return '<button type="button" class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(t.category===c)+'"'+(ro?' disabled':'')+'>'+esc(c)+'</button>';}).join('')+'</div></div>':'';
    var q=monthQ(t.month)||1000;
    var quick=[q,q*2,500,1500].filter(function(v,i,a){return a.indexOf(v)===i;}).map(function(v){return '<button type="button" class="btn sm" data-amt="'+v+'"'+(ro?' disabled':'')+'>'+fmt(v)+'</button>';}).join('');
    var fixedBox=(t.kind==='onbehalf'||t.kind==='payout'||t.kind==='expense')?'<label class="check"><input type="checkbox" id="eFixed"'+(t.fixed?' checked':'')+(ro?' disabled':'')+'> يتكرر كل شهر (ينسخ تلقائياً للشهر الجديد)</label>':'';
    var effect=effectText(t);
    var by=existing&&existing.by&&S.names[existing.by]?'<div class="small muted">أضافها: '+esc(S.names[existing.by])+'</div>':'';
    return '<div class="sheet-h"><h2>'+(existing?'تفاصيل الحركة':'حساب الجمعية')+' · '+esc(shortMonth(t.month))+'</h2><button type="button" class="x" data-close aria-label="إغلاق">×</button></div>'+
      (locked?'<div class="note">هذا الشهر مقفل. افتحه للتعديل من صفحة الشهر.</div>':'')+
      (!existing&&!preset?'<div class="small muted">حركات الأعضاء (القطة، النيابة، التحويل لهم) تُسجَّل من زر «حركات العضو» في بطاقته.</div>':'')+
      (!t.kind?'<div class="note small">اختر نوع الحركة أولاً.</div><div class="kinds">'+kinds+'</div>':'<div class="kinds">'+kinds+'</div>'+mems+
      '<label class="f">المبلغ (ريال)<input type="number" inputmode="decimal" id="eAmt" class="amount" value="'+esc((t.kind==='adjust'||t.kind==='accadj')?t.amount:(t.amount===''?'':Math.abs(t.amount)))+'" placeholder="0"'+(ro?' disabled':'')+'></label><div class="row">'+quick+'</div>'+
      cats+'<label class="f">ملاحظة<input type="text" id="eNote" value="'+esc(t.note||'')+'" placeholder="مثال: تسديد دين، كهرباء البيت القديم"'+(ro?' disabled':'')+'></label>'+fixedBox+
      '<div class="note good small" id="eEffect">'+effect+'</div>'+by+
      '<div id="eErr"></div>'+
      (ro?'':'<div class="row"><button type="button" class="btn pri" id="eSave" style="flex:1">'+(existing?'حفظ التعديل':'حفظ')+'</button>'+(existing?'<button type="button" class="btn danger" id="eDel">حذف</button>':'')+'</div>'));
  }
  function bind(m){
    m.querySelectorAll('[data-kind]').forEach(function(b){b.addEventListener('click',function(){grab();t.kind=b.getAttribute('data-kind');if(!KINDS[t.kind].needsMember)delete t.member;redraw();});});
    m.querySelectorAll('[data-mem]').forEach(function(b){b.addEventListener('click',function(){grab();t.member=b.getAttribute('data-mem');redraw();});});
    m.querySelectorAll('[data-cat]').forEach(function(b){b.addEventListener('click',function(){grab();t.category=b.getAttribute('data-cat');redraw();});});
    m.querySelectorAll('[data-amt]').forEach(function(b){b.addEventListener('click',function(){grab();t.amount=+b.getAttribute('data-amt');redraw();});});
    var a=m.querySelector('#eAmt');if(a)a.addEventListener('input',function(){grab();m.querySelector('#eEffect').innerHTML=effectText(t);});
    var s=m.querySelector('#eSave');if(s)s.addEventListener('click',save);
    var d=m.querySelector('#eDel');if(d)d.addEventListener('click',function(){
      if(d.getAttribute('data-sure')){d.disabled=true;S.db.collection('tx').doc(existing.id).delete().then(function(){done();toast('تم حذف الحركة');}).catch(err);}
      else{d.setAttribute('data-sure','1');d.textContent='اضغط مرة أخرى للتأكيد';}
    });
  }
  function grab(){
    var m=document.getElementById('modal');
    var a=m.querySelector('#eAmt');if(a)t.amount=a.value===''?'':+a.value;
    var n=m.querySelector('#eNote');if(n)t.note=n.value;
    var f=m.querySelector('#eFixed');if(f)t.fixed=f.checked;
  }
  function redraw(){var m=document.getElementById('modal');m.querySelector('.sheet').innerHTML=draw();m.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closeSheet);});bind(m);}
  function err(e){var el=document.getElementById('eErr');if(el)el.innerHTML='<div class="note bad">تعذّر الحفظ: '+esc(errMsg(e))+'</div>';var s=document.getElementById('eSave');if(s)s.disabled=false;}
  function save(){
    grab();
    var e=[];
    var amt=+t.amount;
    if(!amt||(t.kind!=='adjust'&&t.kind!=='accadj'&&amt<=0)) e.push('اكتب المبلغ');
    if(!t.kind){document.getElementById('eErr').innerHTML='<div class="note bad">اختر نوع الحركة</div>';return;}
    if(KINDS[t.kind].needsMember&&!t.member) e.push('اختر العضو');
    if(t.kind==='expense'&&!t.category) e.push('اختر البند');
    if(e.length){document.getElementById('eErr').innerHTML='<div class="note bad">'+e.join(' · ')+'</div>';return;}
    var doc={month:t.month,kind:t.kind,amount:(t.kind==='adjust'||t.kind==='accadj')?r2(amt):r2(Math.abs(amt)),note:(t.note||'').trim(),seq:existing?existing.seq:Date.now(),createdAt:existing?existing.createdAt:new Date().toISOString()};
    if(KINDS[t.kind].needsMember) doc.member=t.member;
    if(t.kind==='expense') doc.category=t.category;
    if(t.fixed&&(t.kind==='onbehalf'||t.kind==='payout'||t.kind==='expense')) doc.fixed=true;
    doc.by=existing&&existing.by?existing.by:(S.uid||'');
    document.getElementById('eSave').disabled=true;
    var ref=existing?S.db.collection('tx').doc(existing.id):S.db.collection('tx').doc();
    ref.set(doc).then(function(){done();toast(existing?'تم حفظ التعديل':'تمت الإضافة');}).catch(err);
  }
  openSheet(draw(),bind);
}

function errMsg(e){

  if(c==='resource_exhausted') return 'محاولات كثيرة متتالية، انتظر قليلاً ثم أعد المحاولة.';
  return 'تحقق من الاتصال ثم أعد المحاولة.';

    });
  });

function doRestore(data,btn){
  var ops=[];
  ops.push(function(){return S.db.doc('config/main').set(clean(data.config));});
  var keepM={},keepT={};
  data.months.forEach(function(m){keepM[m.id]=1;ops.push(function(){var c=clean(m);c.id=m.id;return S.db.collection('months').doc(m.id).set(c);});});
  data.tx.forEach(function(t){keepT[t.id]=1;ops.push(function(){return S.db.collection('tx').doc(t.id).set(clean(t));});});
  S.months.forEach(function(m){if(!keepM[m.id])ops.push(function(){return S.db.collection('months').doc(m.id).delete();});});
  S.tx.forEach(function(t){if(!keepT[t.id])ops.push(function(){return S.db.collection('tx').doc(t.id).delete();});});
  var i=0,n=ops.length;
  function next(){
    if(i>=n){btn.textContent='تم الاسترجاع';toast('تم استرجاع النسخة');return;}
    btn.textContent='جارٍ الاسترجاع… '+i+' من '+n;
    ops[i]().then(function(){i++;setTimeout(next,60);},function(e){
      if(e&&e.code==='resource_exhausted'){setTimeout(next,2000);return;}
      btn.disabled=false;btn.textContent='أكمل الاسترجاع';btn.onclick=function(){btn.disabled=true;btn.onclick=null;next();};toast(errMsg(e));
    });

}

function planOf(id){return ((S.config&&S.config.plans)||{})[id]||null;}
function planInfo(id){
  var pl=planOf(id);if(!pl||!(pl.monthly>0))return null;
  var rows=S.calc.filter(function(c){return c.id>=pl.start&&c.per[id];});
  if(!rows.length)return null;
  var startDebt=Math.max(0,-rows[0].per[id].open);
  var last=lastCalc();var cur=last.per[id]?last.per[id].close:0;var debt=Math.max(0,-cur);
  var paid=Math.max(0,startDebt-debt);
  var hist=rows.map(function(c){var p=c.per[id];var red=r2(p.close-p.open);var closed=!!(monthDoc(c.id)||{}).closed;return {id:c.id,red:red,ok:red>=pl.monthly-0.005,closed:closed};});
  var late=hist.filter(function(h){return h.closed&&!h.ok;});
  var left=debt>0?Math.ceil(debt/pl.monthly):0;
  var endId=last.id;for(var i=0;i<left;i++)endId=monthAfter(endId);
  return {pl:pl,startDebt:startDebt,debt:debt,paid:paid,pct:startDebt?Math.min(100,paid/startDebt*100):100,hist:hist,late:late,left:left,endId:endId};
}

    cats.forEach(function(a){x.fillStyle='#15242A';x.font='400 28px '+F;x.textAlign='right';x.fillText(a[0],W-60,y+30);x.textAlign='left';x.font='600 28px '+F;x.fillText(fmt(a[1]),60,y+30);
      var bw2=(W-560)*a[1]/mx;x.fillStyle='#DCE3DE';rr(x,200,y+12,W-560,22,11);x.fill();x.fillStyle='#0D6655';rr(x,200+(W-560)-bw2,y+12,bw2,22,11);x.fill();y+=62;});
    y+=40;}
  if(showBal&&ms.length){head('أرصدة الأعضاء');y+=10;
    ms.forEach(function(m){var v=c.per[m.id].close;x.fillStyle='#15242A';x.font='400 28px '+F;x.textAlign='right';x.fillText(m.name,W-60,y+30);x.textAlign='left';x.font='600 28px '+F;x.fillStyle=v>0?'#1D7A47':'#B23A30';x.fillText((v>0?'له ':'عليه ')+fmt(Math.abs(v)),60,y+30);y+=62;});
    y+=40;}
  x.fillStyle='#5D6B6F';x.font='400 22px '+F;x.textAlign='center';x.fillText('أُعدّ من تطبيق جمعية البيت · '+new Date().toLocaleDateString('ar-SA-u-ca-gregory-nu-latn'),W/2,H-40);
  void css;return cv;
  function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
  function star(x,cx,cy,R){var p=[[0,-1],[.28,-.28],[1,0],[.28,.28],[0,1],[-.28,.28],[-1,0],[-.28,-.28]];p.forEach(function(q,i){var px=cx+q[0]*R,py=cy+q[1]*R;i?x.lineTo(px,py):x.moveTo(px,py);});x.closePath();}
}

// ===== حالة الأعضاء: انضمام، تجميد، إعادة، إنهاء =====
function statusAt(m,id){return memberStatusAt(m,id||S.sel||'9999-99');}
function statusPill(m,id){var s=statusAt(m,id);return s==='frozen'?' <span class="pill gold">مجمّد</span>':s==='ended'?' <span class="pill zero">منتهي</span>':s==='none'?' <span class="pill zero">ينضم '+esc(shortMonth(m.joined))+'</span>':'';}
function liveMembers(id){return (S.config&&S.config.members||[]).filter(function(m){var s=statusAt(m,id);return s==='active'||s==='frozen';});}
function balanceAt(mid,id){var c=calcOf(id);return c&&c.per[mid]?c.per[mid]:null;}
function setEvents(m,from,status){
  var ev=(m.events||[]).filter(function(e){return e.from<from;});ev.push({from:from,status:status});return ev;
}
function saveMember(mid,patch){
  var ms=(S.config.members||[]).map(function(m){return m.id===mid?Object.assign({},m,patch):m;});
  return S.db.doc('config/main').update({members:ms});
}
function gapCharge(m,uptoId){
  var sum=0,months=[];
  S.calc.forEach(function(c){if(c.id>=uptoId)return;var s=statusAt(m,c.id);if(s==='frozen'||s==='ended'){sum+=monthQ(c.id);months.push(c.id);}});
  // فقط الفترة الأخيرة المتصلة من التوقف
  var cont=[];for(var i=months.length-1;i>=0;i--){if(i===months.length-1||months[i]===prevMonth(months[i+1]))cont.unshift(months[i]);else break;}
  if(cont.length&&cont[cont.length-1]!==prevMonth(uptoId))cont=[];
  sum=cont.reduce(function(s,id){return s+monthQ(id);},0);
  return {sum:sum,months:cont};
}
function prevMonth(id){var y=+id.slice(0,4),m=+id.slice(5,7)-1;if(m<1){m=12;y--;}return y+'-'+(m<10?'0':'')+m;}
function membersCard(){

  }).join('');
  return '<section class="card"><div class="card-h"><h2>الأعضاء</h2><span class="small muted">التغييرات تبدأ من الشهر المختار: '+esc(shortMonth(sel))+'</span></div><div>'+rows+'</div>'+
   '<div style="display:grid;gap:8px;margin-top:12px"><h3>إضافة عضو جديد</h3><input type="text" id="newMember" placeholder="الاسم">'+
   '<div class="row"><input type="number" inputmode="decimal" id="newMemberBal" placeholder="رصيده عند الانضمام (اتركه فارغاً إن لم يوجد)" style="flex:1"><label class="check"><input type="radio" name="nmSign" value="1" checked> له</label><label class="check"><input type="radio" name="nmSign" value="-1"> عليه</label></div>'+
   '<button type="button" class="btn pri" id="addMember">إضافة، وتبدأ قطته من '+esc(shortMonth(sel))+'</button></div></section>';
}

    '<button type="button" class="btn pri" id="msActive">إعادة تنشيط</button></div>';

function normName(s){return String(s||'').replace(/\s+/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْ]/g,'');}
function guessCat(t){
  t=t||'';var rules=[['كهرب','كهرباء'],['راتب العامل','رواتب العمالة'],['مقدم راتب','رواتب العمالة'],['خدام','رواتب العمالة'],['عاملة','رواتب العمالة'],['إقامة','رواتب العمالة'],['اقامة','رواتب العمالة'],['اسنان','علاج'],['أسنان','علاج'],['علاج','علاج'],['مستشفى','علاج'],['شقة مكة','شقة مكة'],['عيدي','عيديات وهدايا'],['هدي','عيديات وهدايا'],['عطر','عيديات وهدايا'],['حلى','عيديات وهدايا'],['هيل','عيديات وهدايا'],['ذبيح','ذبائح'],['معاون','معاونات'],['علف','علف'],['تلفون','تلفون الديرة'],['جوال','تلفون الديرة'],['قسط السيارة','قسط السيارة'],['صيانة','صيانة'],['اصلاح','صيانة'],['إصلاح','صيانة']];
  for(var i=0;i<rules.length;i++)if(t.indexOf(rules[i][0])>=0)return rules[i][1];return 'أخرى';
}
var AR_M={'يناير':1,'فبراير':2,'مارس':3,'ابريل':4,'أبريل':4,'إبريل':4,'مايو':5,'يونيو':6,'يوليو':7,'اغسطس':8,'أغسطس':8,'سبتمبر':9,'اكتوبر':10,'أكتوبر':10,'نوفمبر':11,'ديسمبر':12};
function parseOldWorkbook(X,wb,fallbackYear){
  var out=[],skipped=[];
  wb.SheetNames.forEach(function(sn){
    var nm=sn.replace(/\s+/g,'');var mo=0;Object.keys(AR_M).forEach(function(k){if(nm.indexOf(k)>=0)mo=AR_M[k];});
    if(!mo){skipped.push(sn);return;}
    var ym=(sn.match(/(\d{4})/)||[])[1]||String(fallbackYear);var id=ym+'-'+(mo<10?'0':'')+mo;
    var ws=wb.Sheets[sn];
    var cv=function(r,c){var x=ws[X.utils.encode_cell({r:r-1,c:c-1})];return x?x.v:null;};
    var num=function(r,c){var v=cv(r,c);return typeof v==='number'&&isFinite(v)?v:0;};
    var txt=function(r,c){var v=cv(r,c);return v==null?'':String(v).trim();};
    var balCol=0,depCol=0;
    for(var c=6;c<=12;c++){var h=txt(2,c)+' '+txt(3,c);if(!balCol&&h.indexOf('الرصيد عند القطة')>=0)balCol=c;}
    if(!balCol){if(typeof cv(1,7)==='number')balCol=7;else if(typeof cv(1,10)==='number')balCol=10;}
    if(!balCol){skipped.push(sn);return;}
    for(c=7;c<=12;c++){if(c===balCol)continue;var h2=txt(3,c)+' '+txt(2,c);if(h2.indexOf('الذي')>=0){depCol=c;break;}}
    if(!depCol)depCol=balCol+1;
    var obCols=[7,8,9,10,11].filter(function(x){return x!==balCol&&x!==depCol;});
    var q=num(1,balCol);
    var mem=[],r=4,extRow=0;
    for(;r<60;r++){var n=txt(r,3);if(n.indexOf('دخل خارجي')>=0||txt(r,2).indexOf('دخل خارجي')>=0){extRow=r;break;}if(!n)break;
      mem.push({name:n.replace(/H+$/,'').trim(),open:num(r,4),fixed:num(r,6),ob:obCols.map(function(cc){return num(r,cc);}),dep:num(r,depCol),payFixed:num(r,12),pay:[num(r,13),num(r,14)],note:txt(r,16)});}
    var ext=extRow?{amt:num(extRow,depCol),note:txt(extRow,16)}:{amt:0,note:''};
    var exps=[],start=(extRow||r)+1;
    for(r=start;r<70;r++){var a=txt(r,1)+' '+txt(r,2);if(a.indexOf('المصروف من القطة')>=0||a.indexOf('الباقي في حساب')>=0)break;
      if(txt(r,4)==='المبلغ')continue;var amt=num(r,4);if(!amt)continue;exps.push({amt:amt,label:txt(r,5),note:txt(r,6)});}
    var remain=null;for(r=start;r<75;r++){if((txt(r,1)+' '+txt(r,2)).indexOf('الباقي في حساب')>=0){var v=cv(r,4);remain=typeof v==='number'?v:null;break;}}
    out.push({id:id,q:q,account:num(3,4),members:mem,ext:ext,exps:exps,remain:remain,sheet:sn});
  });
  out.sort(function(a,b){return a.id<b.id?-1:1;});
  return {months:out,skipped:skipped};
}
function buildImport(parsed){
  var f=firstMonthId(),ms=(S.config.members||[]).slice();
  var errors=[],warns=[];
  var months=parsed.months.filter(function(p){if(p.id>=f){errors.push(monthLabel(p.id)+' موجود أو بعد أول شهر في البرنامج');return false;}return true;});
  var dup={};months.forEach(function(p){if(dup[p.id])errors.push('الشهر '+monthLabel(p.id)+' مكرر في الملف');dup[p.id]=1;});
  if(!months.length)return {errors:errors.length?errors:['لم أجد أي شهر في الملف']};
  for(var i=1;i<months.length;i++){if(months[i].id!==monthAfter(months[i-1].id))warns.push('ناقص في الملف: من بعد '+monthLabel(months[i-1].id)+' إلى '+monthLabel(months[i].id));}
  if(monthAfter(months[months.length-1].id)!==f)warns.push('آخر شهر في الملف '+monthLabel(months[months.length-1].id)+' لا يسبق '+monthLabel(f)+' مباشرة');
  var byName={};ms.forEach(function(m){byName[normName(m.name)]=m;});
  var newMembers=[],idOf={};
  months.forEach(function(p){p.members.forEach(function(x){var k=normName(x.name);if(idOf[k])return;var m=byName[k];if(m)idOf[k]=m.id;else{var nm={id:'m'+Date.now().toString(36)+newMembers.length,name:x.name,joined:p.id};newMembers.push(nm);idOf[k]=nm.id;byName[k]=nm;}});});
  var mdocs=[],tdocs=[],seq=Date.now();
  months.forEach(function(p){
    var notes={};
    var add=function(o){if(!o.amount)return;o.month=p.id;o.seq=seq++;o.createdAt=new Date().toISOString();o.by=S.uid||'';o.amount=r2(o.amount);tdocs.push(o);};
    p.members.forEach(function(x){var mid=idOf[normName(x.name)];if(x.note)notes[mid]=x.note;
      add({kind:'onbehalf',member:mid,amount:x.fixed,note:'مصروف ثابت',fixed:true});
      x.ob.forEach(function(v){add({kind:'onbehalf',member:mid,amount:v,note:''});});
      add({kind:'deposit',member:mid,amount:x.dep,note:''});
      add({kind:'payout',member:mid,amount:x.payFixed,note:'دفعة ثابتة',fixed:true});
      x.pay.forEach(function(v){add({kind:'payout',member:mid,amount:v,note:''});});
    });
    add({kind:'external',amount:p.ext.amt,note:p.ext.note});
    p.exps.forEach(function(e){add({kind:'expense',amount:e.amt,category:guessCat(e.label),note:(e.label+(e.note?' — '+e.note:'')).trim()});});
    var md={id:p.id,label:monthLabel(p.id),contribution:p.q,closed:true,notes:notes};var dq=defaultQAt(S.config,p.id);if(dq!=null&&dq!==p.q)md.qOverride=p.q;mdocs.push(md);
  });
  var first=months[0],bal={};first.members.forEach(function(x){bal[idOf[normName(x.name)]]=r2(x.open);});
  // الأعضاء الحاليون غير الموجودين في الملف: انضموا مع أول شهر حالي
  var cfgMembers=ms.map(function(m){var inFile=months.some(function(p){return p.members.some(function(x){return idOf[normName(x.name)]===m.id;});});return (!inFile&&!m.joined)?Object.assign({},m,{joined:f}):m;}).concat(newMembers);
  var oldOpen=S.config.opening||{account:0,balances:{}};
  var anchors=anchorsList();if(!anchors.some(function(a){return a.month===f;}))anchors.push({month:f,account:+oldOpen.account||0,balances:Object.assign({},oldOpen.balances||{})});
  var cfg=Object.assign({},S.config,{members:cfgMembers,opening:{account:r2(first.account),balances:bal},anchors:anchors,firstMonth:first.id});
  // تجربة الحساب قبل الحفظ
  var trial=compute(cfg,S.months.concat(mdocs),S.tx.concat(tdocs));
  var checks=months.map(function(p){var c=trial.filter(function(x){return x.id===p.id;})[0];return {id:p.id,calc:c?c.closeAcc:null,file:p.remain};}).filter(function(x){return x.file!=null&&Math.abs(x.file-x.calc)>0.5;});
  var junction=trial.filter(function(x){return x.id===f;})[0];
  // أعضاء جدد رصيدهم صفر عند الوصول للشهر الحالي: تنتهي عضويتهم
  var lastOld=trial.filter(function(x){return x.id===prevMonth(f);})[0];
  newMembers.forEach(function(nm){var p=lastOld&&lastOld.per[nm.id];var zero=!p||Math.abs(p.close)<0.005;nm.events=[{from:f,status:zero?'ended':'frozen'}];});
  return {errors:errors,warns:warns,months:months,mdocs:mdocs,tdocs:tdocs,cfg:cfg,newMembers:newMembers,checks:checks,junction:junction,skipped:parsed.skipped};
}

function monthQ(id){return contributionOf(S.config,monthDoc(id)||{id:id});}
function qHistory(){return ((S.config&&S.config.qHistory)||[]).slice().sort(function(a,b){return a.from<b.from?-1:1;});}
function ensureQHistory(){

  if(S.config.qHistory&&S.config.qHistory.length)return Promise.resolve();

  var base=+(monthDoc(ids[0])||{}).contribution||1000;var h=[{from:ids[0],amount:base}];

function qCard(){
  var sel=S.sel,mo=monthDoc(sel)||{},h=qHistory(),def=defaultQAt(S.config,sel);

// ===== التخزين على الجهاز =====
var Store=(function(){
  var K='jb-store-v1';
  function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
  var st=null;try{st=JSON.parse(localStorage.getItem(K));}catch(e){}
  if(!st||!st.dev) st={dev:rid(),name:'',recs:{},vv:{},peers:{},setup:false,pw:'',lastId:'',seen:[],outbox:[],sentUpTo:0,batches:{},lastRx:0,lastTx:0};
  ['recs','vv','peers','batches'].forEach(function(k){if(!st[k])st[k]={};});
  ['seen','outbox'].forEach(function(k){if(!st[k])st[k]=[];});
  var saveT=0,listeners=[];
  function saveNow(){saveT=0;try{localStorage.setItem(K,JSON.stringify(st));}catch(e){toast('تعذّر الحفظ على الجهاز: المساحة ممتلئة');}}
  function save(){if(!saveT)saveT=setTimeout(saveNow,150);}
  window.addEventListener('pagehide',function(){if(saveT){clearTimeout(saveT);saveNow();}});
  function changed(){save();listeners.forEach(function(f){f();});}
  function nextU(id){var cur=st.recs[id];return Math.max(Date.now(),(cur?cur.u:0)+1,(st.vv[st.dev]||0)+1);}
  function write(id,data){
    if(typeof undoCapture==='function')undoCapture(id,st.recs[id]);
    var u=nextU(id);var rec={d:data||null,u:u,o:st.dev};if(!data)rec.del=true;
    st.recs[id]=rec;st.vv[st.dev]=u;changed();Sync.scheduleOwn();
  }
  function merge(id,rec){
    if(!rec||typeof rec.u!=='number'||!rec.o)return false;
    if(!/^(config\/main|months\/[\w-]+|tx\/[\w-]+|log\/[\w-]+)$/.test(id))return false;
    var cur=st.recs[id];
    if(!cur||rec.u>cur.u||(rec.u===cur.u&&rec.o>cur.o)){st.recs[id]=rec;return true;}
    return false;
  }
  function view(){
    var c=st.recs['config/main'];var config=c&&!c.del?c.d:null;var months=[],tx=[];
    Object.keys(st.recs).forEach(function(id){var r=st.recs[id];if(r.del||!r.d)return;
      if(id.indexOf('months/')===0){var m=Object.assign({},r.d);m.id=id.slice(7);months.push(m);}
      else if(id.indexOf('tx/')===0){var t=Object.assign({},r.d);t.id=id.slice(3);tx.push(t);}});
    return {config:config,months:months,tx:tx};
  }
  function ref(path){
    return {id:path.split('/').pop(),path:path,

// ===== التمرير عبر ntfy.sh (مشفّر، والرسائل تُحذف من الخادم بعد 12 ساعة) =====
var Sync=(function(){
  var NTFY='https://ntfy.sh/';try{if(localStorage.getItem('jb-ntfy-test'))NTFY=localStorage.getItem('jb-ntfy-test');}catch(e){}var st=Store.st;
  var key=null,topic='',es=null,state='off',flushing=false,ownT=0,lastHello=0,queue=Promise.resolve();
  var te=new TextEncoder(),td=new TextDecoder();
  function b64(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s);}
  function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function hex(buf){return [].map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
  async function streamBytes(u8,T,mode){var s=new Blob([u8]).stream().pipeThrough(new T(mode));return new Uint8Array(await new Response(s).arrayBuffer());}
  var canZip=typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined';
  async function derive(pw){
    var base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey','deriveBits']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('jamiya-albait/key/v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode('jamiya-albait/topic/v1'),iterations:150000,hash:'SHA-256'},base,128);
    return {key:k,topic:'jb'+hex(bits)};
  }
  async function seal(obj){
    var raw=te.encode(JSON.stringify(obj)),flag=0;
    if(canZip){raw=await streamBytes(raw,CompressionStream,'deflate-raw');flag=1;}
    var body=new Uint8Array(raw.length+1);body[0]=flag;body.set(raw,1);
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,body));
    var all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return 'J1'+b64(all);
  }
  async function unseal(s){
    try{
      if(typeof s!=='string'||s.slice(0,2)!=='J1')return null;
      var all=unb64(s.slice(2));var pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:all.subarray(0,12)},key,all.subarray(12)));
      var raw=pt.subarray(1);if(pt[0]===1)raw=await streamBytes(raw,DecompressionStream,'deflate-raw');
      return JSON.parse(td.decode(raw));
    }catch(e){return null;}
  }
  function setState(s){state=s;render();}
  // ---- الإرسال ----
  function enqueue(msgs){msgs.forEach(function(m){st.outbox.push(m);});if(st.outbox.length>400)st.outbox=st.outbox.slice(-400);Store.save();flush();}
  async function flush(){
    if(flushing||!topic)return;flushing=true;
    try{
      while(st.outbox.length){
        var r;try{r=await fetch(NTFY+topic,{method:'POST',body:st.outbox[0]});}catch(e){setState('offline');break;}
        if(r.status===429){await new Promise(function(res){setTimeout(res,6000);});continue;}
        if(!r.ok){setState('error');break;}
        st.outbox.shift();st.lastTx=Date.now();Store.save();
        await new Promise(function(res){setTimeout(res,350);});
      }
    }finally{flushing=false;render();}
  }
  async function sendBatch(o,since,upTo,entries){
    if(!key)return;
    var bid=Store.rid();
    async function split(g){var b=await seal({t:'chg',f:st.dev,o:o,s:since,up:upTo,b:bid,p:0,n:0,r:g});if(b.length<=3700||g.length<=1)return [g];var h=Math.ceil(g.length/2);return (await split(g.slice(0,h))).concat(await split(g.slice(h)));}
    var groups=entries.length?await split(entries):[[]];
    var msgs=[];for(var i=0;i<groups.length;i++)msgs.push(await seal({t:'chg',f:st.dev,o:o,s:since,up:upTo,b:bid,p:i,n:groups.length,r:groups[i]}));
    enqueue(msgs);
  }
  function entriesOf(o,after){return Object.keys(st.recs).filter(function(id){var r=st.recs[id];return r.o===o&&r.u>after;}).map(function(id){return [id,st.recs[id]];});}
  function scheduleOwn(){if(!key)return;clearTimeout(ownT);ownT=setTimeout(sendOwn,1200);}
  function sendOwn(){var up=st.vv[st.dev]||0,since=st.sentUpTo||0;if(up<=since)return;st.sentUpTo=up;Store.save();sendBatch(st.dev,since,up,entriesOf(st.dev,since));}
  async function hello(force){
    if(!key)return;if(!force&&Date.now()-lastHello<60000)return;lastHello=Date.now();
    enqueue([await seal({t:'hello',f:st.dev,nm:st.name||'',vv:st.vv,at:Date.now()})]);
  }
  // ---- الاستلام ----
  function respond(x){
    var mine=st.vv,theirs=x.vv||{},need=false;
    Object.keys(mine).forEach(function(o){var a=mine[o]||0,b=theirs[o]||0;if(a>b)sendBatch(o,b,a,entriesOf(o,b));});
    Object.keys(theirs).forEach(function(o){if((theirs[o]||0)>(mine[o]||0))need=true;});
    if(need)hello(false);
  }
  async function onMsg(m){
    if(!m||m.event!=='message'||!m.id)return;

      x.r.forEach(function(e){if(Array.isArray(e))Store.merge(e[0],e[1]);});

  function handle(m){queue=queue.then(function(){return onMsg(m);}).catch(function(){});return queue;}
  async function poll(){
    var r=await fetch(NTFY+topic+'/json?poll=1&since='+(st.lastId||'all'));
    if(!r.ok)throw new Error('poll');
    var lines=(await r.text()).split('\n');
    for(var i=0;i<lines.length;i++){if(!lines[i].trim())continue;try{await handle(JSON.parse(lines[i]));}catch(e){}}
  }
  function live(){
    if(es)es.close();
    es=new EventSource(NTFY+topic+'/sse?since='+(st.lastId||'all'));
    es.onopen=function(){setState('live');};
    es.onmessage=function(e){try{handle(JSON.parse(e.data));}catch(x){}};
    es.onerror=function(){if(state!=='off')setState(navigator.onLine?'connecting':'offline');};
  }
  function repostOwn(){
    var me=st.dev,up=st.vv[me]||0;if(!up)return;
    var ids=Object.keys(st.peers);var min=up;
    if(!ids.length)min=0;else ids.forEach(function(i){var v=(st.peers[i].vv||{})[me]||0;if(v<min)min=v;});
    if(min<up)sendBatch(me,min,up,entriesOf(me,min));
    st.sentUpTo=Math.max(st.sentUpTo||0,up);Store.save();
  }
  async function start(){
    if(!st.pw){setState('off');return;}
    setState('connecting');
    try{var d=await derive(st.pw);key=d.key;topic=d.topic;}catch(e){setState('error');return;}
    try{await poll();}catch(e){setState(navigator.onLine?'error':'offline');}

  window.addEventListener('online',function(){if(key){flush();hello(false);}});
  var hiddenAt=0;
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){hiddenAt=Date.now();Store.saveNow();return;}
    if(key&&Date.now()-hiddenAt>120000){poll().catch(function(){});hello(true);repostOwn();flush();}
  });
  async function syncNow(){if(!key){await start();return;}try{await poll();}catch(e){}await hello(true);repostOwn();flush();if(!es||es.readyState===2)live();}
  function stop(){if(es)es.close();es=null;key=null;topic='';setState('off');}
  return {start:start,stop:stop,scheduleOwn:scheduleOwn,syncNow:syncNow,
    info:function(){return {state:state,topic:topic,out:st.outbox.length,lastRx:st.lastRx,lastTx:st.lastTx,peers:st.peers};}};
})();

// ===== سجل التعديلات =====
function logDescribe(id,prev,next){
  var mon=function(m){return m?shortMonth(m):'';};
  if(id.indexOf('tx/')===0){
    var t=next||prev;if(!t)return '';
    var who=t.member?member(t.member).name:(t.category||(t.kind==='external'?'دخل خارجي':''));
    var what=(KTXT[t.kind]?KTXT[t.kind].short:'حركة')+(who?' · '+who:'')+' · '+((t.kind==='adjust'||t.kind==='accadj')&&+t.amount<0?'−':'')+fmt(Math.abs(+t.amount||0));
    var verb=!prev?'إضافة':!next?'حذف':'تعديل';
    if(prev&&next&&+prev.amount!==+next.amount)what+=' (كان '+fmt(Math.abs(+prev.amount||0))+')';
    return verb+': '+what+' — '+mon(t.month);
  }
  if(id.indexOf('months/')===0){
    var mid=id.slice(7);
    if(!prev)return 'بدء شهر '+monthLabel(mid);
    if(!next)return 'حذف شهر '+mon(mid);
    if(!prev.closed&&next.closed)return 'إقفال شهر '+mon(mid);
    if(prev.closed&&!next.closed)return 'فتح شهر '+mon(mid);
    if(JSON.stringify(prev.exempt||[])!==JSON.stringify(next.exempt||[])){var a=(next.exempt||[]).filter(function(x){return (prev.exempt||[]).indexOf(x)<0;}),r=(prev.exempt||[]).filter(function(x){return (next.exempt||[]).indexOf(x)<0;});return (a.length?'إعفاء '+a.map(function(x){return member(x).name;}).join('، '):'إلغاء إعفاء '+r.map(function(x){return member(x).name;}).join('، '))+' من قطة '+mon(mid);}
    if(prev.bank!==next.bank)return 'مطابقة البنك في '+mon(mid)+': '+(next.bank==null?'مسح':fmt(next.bank));
    if((prev.qOverride==null?null:+prev.qOverride)!==(next.qOverride==null?null:+next.qOverride))return next.qOverride==null?'رجوع '+mon(mid)+' للقطة الافتراضية':'قطة خاصة لشهر '+mon(mid)+': '+fmt(next.qOverride);
    if(+prev.contribution!==+next.contribution)return 'تغيير القطة في '+mon(mid)+' إلى '+fmt(next.contribution);
    return 'تعديل شهر '+mon(mid);
  }
  if(id==='config/main'){
    if(!prev)return 'إنشاء الجمعية';
    if(JSON.stringify(prev.members)!==JSON.stringify(next.members)){
      var pm={};(prev.members||[]).forEach(function(m){pm[m.id]=m;});
      var out=[];(next.members||[]).forEach(function(m){var o=pm[m.id];if(!o)out.push('إضافة عضو: '+m.name);else{if(o.name!==m.name)out.push('تغيير اسم '+o.name+' إلى '+m.name);if(JSON.stringify(o.events||[])!==JSON.stringify(m.events||[])){var e=(m.events||[])[(m.events||[]).length-1]||{};out.push(({frozen:'تجميد',active:'إعادة تنشيط',ended:'إنهاء عضوية'})[e.status]+' '+m.name+' من '+mon(e.from));}}});
      return out.join(' · ')||'تعديل الأعضاء';
    }
    if(JSON.stringify(prev.opening)!==JSON.stringify(next.opening)&&prev.firstMonth===next.firstMonth&&JSON.stringify(prev.anchors||[])===JSON.stringify(next.anchors||[]))return 'تعديل أرصدة البداية في '+mon(next.firstMonth||firstMonthId());
    if(JSON.stringify(prev.anchors||[])!==JSON.stringify(next.anchors||[])&&JSON.stringify(prev.opening)===JSON.stringify(next.opening))return 'معالجة فرق الترحيل بين السنوات';
    if(JSON.stringify(prev.opening)!==JSON.stringify(next.opening))return 'إضافة أشهر سابقة (من '+mon(next.firstMonth)+' '+String(next.firstMonth||'').slice(0,4)+')';
    if(JSON.stringify(prev.qHistory||[])!==JSON.stringify(next.qHistory||[])){var nh=(next.qHistory||[]).filter(function(x){return !(prev.qHistory||[]).some(function(y){return y.from===x.from&&+y.amount===+x.amount;});})[0];return nh?'القطة الافتراضية '+fmt(nh.amount)+' من '+mon(nh.from)+' '+nh.from.slice(0,4):'تعديل القطة الافتراضية';}
    if(JSON.stringify(prev.plans||{})!==JSON.stringify(next.plans||{}))return 'تعديل خطة سداد';
    if(JSON.stringify(prev.categories)!==JSON.stringify(next.categories))return 'تعديل بنود المصروفات';
    return 'تعديل الإعدادات';
  }
  return '';
}
function writeLog(label){
  if(!label)return;Undo.silent=true;
  try{Store.write('log/'+Date.now().toString(36)+Store.rid().slice(0,4),{at:Date.now(),dev:Store.st.name||'',l:label});}finally{Undo.silent=false;}
}
function logGroup(g,prefix){
  var ids=Object.keys(g).filter(function(k){return k.indexOf('log/')!==0;});if(!ids.length)return;
  var cur=function(id){var r=Store.st.recs[id];return r&&!r.del?r.d:null;};
  if(ids.length>1&&ids.every(function(id){var n=cur(id);return id.indexOf('months/')===0&&n&&n.closed&&g[id]&&!g[id].closed;})){writeLog((prefix||'')+'أرشفة '+ids.length+' شهر ('+ids.map(function(id){return id.slice(7);}).sort()[0].slice(0,4)+')');return;}
  if(ids.length>6){writeLog((prefix||'')+'تعديل جماعي: '+ids.length+' تغيير');return;}
  var parts=ids.map(function(id){return logDescribe(id,g[id],cur(id));}).filter(Boolean);
  if(parts.length)writeLog((prefix||'')+parts.join(' · '));
}
function pruneLogs(){
  var ks=Object.keys(Store.st.recs).filter(function(k){return k.indexOf('log/')===0;});
  if(ks.length<=400)return;
  ks.sort(function(a,b){return (Store.st.recs[a].u)-(Store.st.recs[b].u);}).slice(0,ks.length-400).forEach(function(k){delete Store.st.recs[k];});Store.save();
}
function logCard(){
  var ks=Object.keys(Store.st.recs).filter(function(k){var r=Store.st.recs[k];return k.indexOf('log/')===0&&r&&!r.del&&r.d;});
  var items=ks.map(function(k){return Store.st.recs[k].d;}).sort(function(a,b){return b.at-a.at;}).slice(0,60);
  return '<section class="card" style="display:grid;gap:8px"><div class="card-h" style="margin:0"><h2>سجل التعديلات</h2><span class="small muted">آخر '+items.length+' تغيير من كل الأجهزة</span></div>'+
   (items.length?'<div style="display:grid;max-height:420px;overflow:auto">'+items.map(function(it){var d=new Date(it.at);return '<div style="padding:8px 2px;border-bottom:1px solid var(--line)"><div class="small">'+esc(it.l)+'</div><div class="small muted">'+esc(it.dev||'جهاز')+' · '+esc(d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn'))+' '+esc(d.toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit'}))+'</div></div>';}).join('')+'</div>':'<div class="small muted">لا توجد تعديلات بعد. كل تغيير من الآن يُسجَّل هنا.</div>')+'</section>';
}

pruneLogs();

})();
</script>
