<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جمعية البيت</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D6655">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* الفكرة: دفتر حسابات عائلي أخضر داكن بلمسة ذهبية؛ الجوال أولاً، شريط تنقل سفلي، وعلى الكمبيوتر عمود جانبي */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#15242A; --muted:#5D6B6F; --line:#DCE3DE;
  --accent:#0D6655; --accent-ink:#FFFFFF; --accent-soft:#E0EFEA; --gold:#B5832A; --gold-soft:#F6EBD5;
  --pos:#1D7A47; --pos-soft:#E1F2E7; --neg:#B23A30; --neg-soft:#F8E4E1;
  --font-display:"Reem Kufi","Readex Pro",Tahoma,sans-serif;
  --font-body:"Readex Pro",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(15,40,35,.06),0 6px 20px rgba(15,40,35,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162126; --surface-2:#1B282D; --ink:#E5EEEC; --muted:#93A4A6; --line:#26373C;
  --accent:#3DB59D; --accent-ink:#06231D; --accent-soft:#163C35; --gold:#E2B262; --gold-soft:#3A2F1A;
  --pos:#5DCB8B; --pos-soft:#173726; --neg:#F07D72; --neg-soft:#3F1F1C; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162126; --surface-2:#1B282D; --ink:#E5EEEC; --muted:#93A4A6; --line:#26373C;
  --accent:#3DB59D; --accent-ink:#06231D; --accent-soft:#163C35; --gold:#E2B262; --gold-soft:#3A2F1A;
  --pos:#5DCB8B; --pos-soft:#173726; --neg:#F07D72; --neg-soft:#3F1F1C; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15.5px}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;max-width:1100px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:19px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--gold)}
main{max-width:1100px;margin:0 auto;width:100%;padding:8px 16px 110px;display:grid;gap:14px;align-content:start}

nav.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;padding:6px 2px;border-radius:10px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr}
  nav.tabs{position:sticky;top:0;height:100vh;grid-template-columns:1fr;align-content:start;border-top:0;border-inline-start:1px solid var(--line);padding:80px 12px 12px;gap:4px;inset:auto}
  nav.tabs a{flex-direction:row;gap:10px;font-size:14.5px;padding:10px 12px;justify-content:flex-start}
  .top{grid-column:2} main{grid-column:2;padding-bottom:40px}
  nav.tabs{grid-row:1 / span 2;grid-column:1}
  .fab{bottom:28px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1.1fr 1fr}}

.hero{background:var(--accent);color:var(--accent-ink);border:0;position:relative;overflow:hidden}
.hero .lbl{opacity:.85;font-size:13.5px}
.hero .big{font-family:var(--font-display);font-size:40px;line-height:1.1;margin:4px 0 2px}
.hero .cur{font-size:15px;opacity:.85;margin-inline-start:6px;font-family:var(--font-body)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-stats div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
:root[data-theme="dark"] .hero-stats div{background:rgba(0,0,0,.14)}
.hero-stats b{display:block;font-size:16px;font-weight:600}
.hero-stats span{font-size:11.5px;opacity:.85}
:root[data-theme="dark"] .hero{background:linear-gradient(160deg,#17493F,#0F2E28);color:#E8F2EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(160deg,#17493F,#0F2E28);color:#E8F2EF}}
:root[data-theme="dark"] .av{filter:brightness(1.7) saturate(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{filter:brightness(1.7) saturate(.9)}}
.hero .pattern{position:absolute;inset-inline-start:-30px;top:-30px;width:170px;height:170px;opacity:.12;pointer-events:none}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.zero{background:var(--surface-2);color:var(--muted)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.mlist{display:grid;gap:2px}
.mrow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;text-decoration:none;color:inherit}
.mrow:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:16px;background:var(--surface-2);color:var(--accent);border:1px solid var(--line)}
.mrow .bar{height:4px;border-radius:4px;background:var(--surface-2);margin-top:5px;position:relative;overflow:hidden}
.mrow .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.amt{font-weight:600;text-align:end}
.amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip svg{width:13px;height:13px}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.flow{grid-template-columns:repeat(2,1fr)}}
.flow div{background:var(--surface-2);border-radius:10px;padding:10px}
.flow span{font-size:12px;color:var(--muted);display:block}
.flow b{font-size:17px;font-weight:600}
.flow .end{background:var(--accent-soft)} .flow .end b{color:var(--accent)}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--surface)}
.q .st{font-size:12px}
.q button{justify-self:start}
.qbtn{text-align:start;cursor:pointer;font:inherit;color:inherit}
.qbtn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.qbtn:disabled{cursor:default}

.btn{border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.danger{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.txl{display:grid}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface-2)}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.k-deposit .ic,.k-external .ic{background:var(--pos-soft);color:var(--pos)}
.k-expense .ic{background:var(--neg-soft);color:var(--neg)}
.k-payout .ic{background:var(--gold-soft);color:var(--gold)}
.k-onbehalf .ic,.k-adjust .ic{background:var(--accent-soft);color:var(--accent)}
.tx .t1{font-weight:500}
.tx .t2{font-size:12.5px;color:var(--muted)}
.plus{color:var(--pos)} .minus{color:var(--neg)} .neutral{color:var(--accent)}
.sec-t{font-size:12.5px;color:var(--muted);font-weight:500;padding:12px 4px 2px;display:flex;justify-content:space-between}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 8px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-bottom:0}

.fab{position:fixed;bottom:84px;inset-inline-start:auto;inset-inline-end:18px;z-index:25;border-radius:16px;padding:14px 20px;box-shadow:0 8px 24px rgba(13,102,85,.35);font-size:15.5px}
@media (min-width:900px){.fab{inset-inline-end:32px}}

.overlay{position:fixed;inset:0;background:rgba(8,20,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.x{background:var(--surface-2);border:0;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);cursor:pointer;text-align:start;display:grid;gap:4px}
.kind b{font-weight:600;font-size:14px}
.kind span{font-size:12px;color:var(--muted)}
.kind[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kind .ic{margin-bottom:2px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;width:100%;color:var(--ink)}
input.amount{font-size:26px;font-weight:600;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.note{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.bad{background:var(--neg-soft)} .note.good{background:var(--pos-soft)}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}

.barchart{display:grid;gap:9px}
.bc{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13.5px}
.bc .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bc .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bc:first-child .track i{background:var(--gold)}
svg.line text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:4px}
.lock svg{width:13px;height:13px}
.formula{font-size:12.5px;color:var(--muted);line-height:1.9}
.formula b{color:var(--ink);font-weight:500}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.mcards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mnote{font-size:12px;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:3px 8px;justify-self:start}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<body>
<div class="app">
  <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">ج</div><div><h1>جمعية البيت</h1><div class="sync" id="sync"><span class="dot"></span><span>جارٍ الاتصال…</span></div></div></div>
    <button class="btn sm" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">الوضع الليلي</button>
  </header>
  <main id="view"><div class="card empty">جارٍ تحميل بيانات الجمعية…</div></main>
</div>
<button class="btn pri fab" id="fab" type="button" hidden>+ حركة جديدة</button>
<div id="modal"></div>

<script>
// ===== محرك الحسابات (نفس قواعد ملف الإكسل) =====
// رصيد العضو الجديد = الرصيد السابق − القطة + ما حوّله للحساب + ما دفعه نيابة عن الجمعية − ما استلمه من الحساب ± التسويات
// رصيد الحساب الجديد = الباقي السابق + تحويلات الأعضاء + الدخل الخارجي − المصروفات − ما حُوّل للأعضاء
var KINDS = {
  deposit:  { acc: +1, mem: +1, needsMember: true },
  external: { acc: +1, mem: 0,  needsMember: false },
  expense:  { acc: -1, mem: 0,  needsMember: false },
  payout:   { acc: -1, mem: -1, needsMember: true },
  onbehalf: { acc: 0,  mem: +1, needsMember: true },
  adjust:   { acc: 0,  mem: +1, needsMember: true }
};
function r2(x){ return Math.round((+x || 0) * 100) / 100; }
function monthAfter(id){
  var y = +id.slice(0,4), m = +id.slice(5,7) + 1;
  if (m > 12) { m = 1; y++; }
  return y + '-' + (m < 10 ? '0' : '') + m;
}
function compute(config, months, txs){
  config = config || {};
  var members = config.members || [];
  var ms = months.slice().sort(function(a,b){ return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
  var acc = +((config.opening || {}).account || 0);
  var bal = {};
  var ob = (config.opening || {}).balances || {};
  members.forEach(function(m){ bal[m.id] = +(ob[m.id] || 0); });
  var byMonth = {};
  txs.forEach(function(t){ (byMonth[t.month] = byMonth[t.month] || []).push(t); });
  var out = [];
  ms.forEach(function(mo){
    var q = +mo.contribution || 0;
    var list = (byMonth[mo.id] || []).slice().sort(function(a,b){ return (a.seq||0) - (b.seq||0); });
    var r = { id: mo.id, month: mo, openAcc: r2(acc), dep: 0, ext: 0, exp: 0, pay: 0, per: {}, tx: list, byCat: {} };
    var exempt = mo.exempt || [];
    members.forEach(function(m){
      var charged = m.active !== false && exempt.indexOf(m.id) < 0;
      r.per[m.id] = { open: r2(bal[m.id] || 0), contrib: charged ? q : 0, dep: 0, onb: 0, pay: 0, adj: 0 };
    });
    list.forEach(function(t){
      var a = +t.amount || 0, k = KINDS[t.kind];
      if (!k) return;
      var p = null;
      if (k.needsMember) {
        if (!r.per[t.member]) r.per[t.member] = { open: r2(bal[t.member] || 0), contrib: 0, dep: 0, onb: 0, pay: 0, adj: 0 };
        p = r.per[t.member];
      }
      if (t.kind === 'deposit') { r.dep += a; p.dep += a; }
      else if (t.kind === 'external') { r.ext += a; }
      else if (t.kind === 'expense') { r.exp += a; var c = t.category || 'أخرى'; r.byCat[c] = (r.byCat[c] || 0) + a; }
      else if (t.kind === 'payout') { r.pay += a; p.pay += a; }
      else if (t.kind === 'onbehalf') { p.onb += a; }
      else if (t.kind === 'adjust') { p.adj += a; }
    });
    var sumBal = 0, owedTo = 0, owedBy = 0;
    Object.keys(r.per).forEach(function(id){
      var p = r.per[id];
      p.close = r2(p.open - p.contrib + p.dep + p.onb - p.pay + p.adj);
      bal[id] = p.close;
      sumBal += p.close;
      if (p.close > 0) owedTo += p.close; else owedBy -= p.close;
    });
    acc = acc + r.dep + r.ext - r.exp - r.pay;
    r.closeAcc = r2(acc);
    r.inc = r2(r.dep + r.ext);
    r.out = r2(r.exp + r.pay);
    r.owedTo = r2(owedTo);   // مستحقات للأعضاء على الجمعية
    r.owedBy = r2(owedBy);   // ديون على الأعضاء للجمعية
    r.net = r2(acc - sumBal); // «المفترض» في الإكسل: صافي ما تملكه الجمعية فعلاً
    out.push(r);
  });
  return out;
}


</script>
<script>
(function(){

var MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var KTXT={
  deposit:{t:'عضو حوّل للجمعية',s:'القطة أو تسديد دين',short:'تحويل للحساب'},

  payout:{t:'الجمعية حوّلت لعضو',s:'سلفة له أو تسديد ما له',short:'استلم من الحساب'},
  onbehalf:{t:'عضو دفع من جيبه',s:'عن الجمعية ولم يمر بالحساب',short:'دفع نيابة'},
  external:{t:'دخل من خارج الأعضاء',s:'دعم، عائد، هدية',short:'دخل خارجي'},
  adjust:{t:'تسوية رصيد',s:'تعديل رصيد عضو فقط',short:'تسوية'}
};
var ICON={
  deposit:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  external:'<path d="M12 3v18M3 12h18"/>',
  expense:'<path d="M12 5v14M5 12l7 7 7-7"/>',
  payout:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  onbehalf:'<path d="M20 12a8 8 0 1 1-8-8"/><path d="M12 8v4l3 2"/>',

function svg(n,extra){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(extra||'')+'>'+ICON[n]+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){n=r2(n);var a=Math.abs(n);return a.toLocaleString('en-US',{maximumFractionDigits:2});}
function N(n){return '<span class="num">'+fmt(n)+'</span>';}
function SN(n){return '<span class="num">'+(n<0?'−':'')+fmt(n)+'</span>';}
function monthLabel(id){return 'بعد راتب '+MONTHS_AR[+id.slice(5,7)-1]+' '+id.slice(0,4);}
function shortMonth(id){return MONTHS_AR[+id.slice(5,7)-1];}
function balPill(v){

}

// ===== الحالة =====
var S={db:null,user:null,uid:null,canWrite:true,config:null,months:[],tx:[],got:{config:false,months:false,tx:false},
  confirmed:false,error:null,sel:null,unlocked:{},calc:[],names:{},dl:null};
var route='home';

function recompute(){
  S.calc=S.config?compute(S.config,S.months,S.tx):[];
  if(!S.sel||!S.months.some(function(m){return m.id===S.sel;})){
    var open=S.months.filter(function(m){return !m.closed;}).map(function(m){return m.id;}).sort();
    var all=S.months.map(function(m){return m.id;}).sort();
    S.sel=open.length?open[open.length-1]:all[all.length-1]||null;
  }
}
function member(id){return (S.config&&S.config.members||[]).filter(function(m){return m.id===id;})[0]||{id:id,name:'عضو محذوف'};}
function activeMembers(){return (S.config&&S.config.members||[]).filter(function(m){return m.active!==false;});}
function calcOf(id){return S.calc.filter(function(c){return c.id===id;})[0];}
function lastCalc(){return S.calc[S.calc.length-1];}
function monthDoc(id){return S.months.filter(function(m){return m.id===id;})[0];}
function isLocked(id){var m=monthDoc(id);return !!(m&&m.closed&&!S.unlocked[id]);}

var raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;doRender();});}

// ===== التنقل =====
var TABS=[['home','الرئيسية'],['month','الشهر'],['members','الأعضاء'],['reports','التقارير'],['tools','أدوات']];
function renderTabs(){
  var base=route.indexOf('member-')===0?'members':route;
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<a href="#'+t[0]+'"'+(base===t[0]?' aria-current="page"':'')+'>'+svg(t[0])+'<span>'+t[1]+'</span></a>';
  }).join('');
}
function readRoute(){
  var h=(location.hash||'').replace('#','');
  route=/^(home|month|members|reports|tools|member-[a-z0-9]+)$/.test(h)?h:'home';
  render();
}
window.addEventListener('hashchange',readRoute);

// ===== العرض =====
function doRender(){
  renderTabs();
  var v=document.getElementById('view'), fab=document.getElementById('fab');
  setSync();
  if(!S.got.config||!S.got.months||!S.got.tx){
    v.innerHTML='<div class="card empty">'+(S.error?esc(S.error):'جارٍ تحميل بيانات الجمعية…')+'</div>';fab.hidden=true;return;
  }
  if(!S.config){v.innerHTML=viewSetup();fab.hidden=true;bindSetup();return;}
  fab.hidden=!S.canWrite||route==='tools'||!S.sel||isLocked(S.sel);
  var html;
  if(route==='home') html=viewHome();
  else if(route==='month') html=viewMonth();
  else if(route==='members') html=viewMembers();
  else if(route.indexOf('member-')===0) html=viewMember(route.slice(7));
  else if(route==='reports') html=viewReports();
  else html=viewTools();
  var ae=document.activeElement,fid=ae&&v.contains(ae)&&ae.id?ae.id:null,sel=null,vals={};
  if(fid){try{sel=[ae.selectionStart,ae.selectionEnd];}catch(e){}}
  v.querySelectorAll('input[id]:not([type=file]):not([type=checkbox]):not([type=radio]),textarea[id]').forEach(function(i){vals[i.id]=i.value;});
  v.innerHTML=backupBanner()+html;
  bindView();
  var vkey=route+'|'+S.sel,same=doRender.k===vkey;doRender.k=vkey;
  if(same)Object.keys(vals).forEach(function(k){var i=document.getElementById(k);if(i&&i.value!==vals[k]&&!/^(eAmt)$/.test(k))i.value=vals[k];});
  if(fid&&same){var nf=document.getElementById(fid);if(nf){nf.focus();try{if(sel&&sel[0]!=null)nf.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
}
function viewHome(){
  var c=lastCalc();
  if(!c) return '<div class="card empty">لا يوجد شهر بعد.</div>';
  var first=S.calc[0];
  var ms=(S.config.members||[]);
  var maxAbs=1;ms.forEach(function(m){var p=c.per[m.id];if(p)maxAbs=Math.max(maxAbs,Math.abs(p.close));});
  var rows=ms.map(function(m){
    var p=c.per[m.id]||{close:0};var v=p.close;var w=Math.abs(v)/maxAbs*50;
    var startV=first&&first.per[m.id]?first.per[m.id].open:0;var d=r2(v-startV);
    var trend='';
    if(Math.abs(d)>0.005&&Math.abs(v)>0.005){trend=(v<0&&d<0)?'زاد دينه '+N(d)+' منذ '+shortMonth(first.id):(v<0&&d>0)?'نقص دينه '+N(d)+' منذ '+shortMonth(first.id):(v>0&&d>0)?'زادت مستحقاته '+N(d):'نقصت مستحقاته '+N(d);}
    var bar=v>=0?'<i style="inset-inline-start:50%;width:'+w+'%;background:var(--pos)"></i>':'<i style="inset-inline-end:50%;width:'+w+'%;background:var(--neg)"></i>';
    return '<a class="mrow" href="#member-'+esc(m.id)+'">'+av(m)+'<div><div>'+esc(m.name)+(m.active===false?' <span class="pill zero">موقوف</span>':'')+'</div><div class="small muted">'+(trend||'&nbsp;')+'</div></div><div class="amt">'+balPill(v)+'</div></a>';
  }).join('');
  var recent=S.tx.slice().sort(function(a,b){return (b.month+String(1e15+(b.seq||0))).localeCompare(a.month+String(1e15+(a.seq||0)));}).slice(0,6);
  var mo=monthDoc(c.id);
  var paid=quickStatus(c);var unpaid=paid.filter(function(x){return x.state==='due';});
  return ''+
  '<section class="card hero"><svg class="pattern" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M50 2l14 34 34 14-34 14-14 34-14-34L2 50l34-14z"/><circle cx="50" cy="50" r="22"/></g></svg>'+
    '<div class="lbl">رصيد حساب الجمعية الآن · '+esc(mo?mo.label||monthLabel(c.id):'')+' · '+esc(hijriOf(c.id))+'</div>'+
    '<div class="big"><span class="num" data-count="'+c.closeAcc+'">'+(c.closeAcc<0?'−':'')+fmt(c.closeAcc)+'</span><span class="cur">ريال</span></div><button type="button" class="btn sm" id="homeReport" style="position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.16);border-color:transparent;color:inherit">صورة التقرير</button>'+
    '<div class="hero-stats">'+
      '<div><span>ديون على الأعضاء</span><b>'+N(c.owedBy)+'</b></div>'+
      '<div><span>مستحقات للأعضاء</span><b>'+N(c.owedTo)+'</b></div>'+
      '<div><span>الصافي بعد التسوية</span><b>'+SN(c.net)+'</b></div>'+
    '</div></section>'+
  lateNotes().map(function(t){return '<div class="note bad">'+esc(t)+'. <a href="#members">الأعضاء</a></div>';}).join('')+
  (unpaid.length&&!isLocked(c.id)?'<div class="note">لم تُسجَّل قطة '+esc(unpaid.map(function(x){return x.m.name;}).join('، '))+' في '+esc(shortMonth(c.id))+'. <a href="#month">سجّلها من صفحة الشهر</a></div>':'')+
  '<div class="grid2">'+
    '<section class="card"><div class="card-h"><h2>أرصدة الأعضاء</h2><span class="small muted">«له» = الجمعية مدينة له</span></div><div class="mlist">'+rows+'</div></section>'+
    '<section class="card"><div class="card-h"><h2>آخر الحركات</h2><a class="small" href="#month">كل حركات الشهر</a></div><div class="txl">'+(recent.length?recent.map(txRow).join(''):'<div class="empty">لا توجد حركات بعد</div>')+'</div></section>'+
  '</div>';
}

function txTitle(t){
  if(t.kind==='expense') return esc(t.category||'مصروف');
  if(t.kind==='external') return 'دخل خارجي';
  var m=member(t.member).name;
  if(t.kind==='deposit') return esc(m)+' حوّل للحساب';
  if(t.kind==='payout') return 'تحويل إلى '+esc(m);
  if(t.kind==='onbehalf') return esc(m)+' دفع نيابة عن الجمعية';
  if(t.kind==='adjust') return 'تسوية رصيد '+esc(m);
  return '';
}
function txRow(t){
  var k=KINDS[t.kind]||{};
  var sign=k.acc>0?'plus':k.acc<0?'minus':'neutral';
  var pre=k.acc>0?'+':k.acc<0?'−':(t.kind==='adjust'&&t.amount<0?'−':'');
  var sub=[];
  if(t.note) sub.push(esc(t.note));
  if(t.fixed) sub.push('يتكرر شهرياً');
  if(route==='home') sub.unshift(esc(shortMonth(t.month)));
  if(k.acc===0) sub.push('لا يمر بالحساب');
  return '<button type="button" class="tx k-'+esc(t.kind)+'" data-tx="'+esc(t.id)+'"><span class="ic">'+svg(t.kind)+'</span><span><span class="t1">'+txTitle(t)+'</span><br><span class="t2">'+(sub.join(' · ')||'&nbsp;')+'</span></span><span class="amt '+sign+'"><span class="num">'+pre+fmt(t.amount)+'</span></span></button>';
}

function quickStatus(c){
  var q=+(monthDoc(c.id)||{}).contribution||0;
  return activeMembers().map(function(m){
    var p=c.per[m.id]||{open:0,dep:0};
    var dep=c.tx.filter(function(t){return t.kind==='deposit'&&t.member===m.id;}).reduce(function(s,t){return s+(+t.amount||0);},0);
    var ex=((monthDoc(c.id)||{}).exempt||[]).indexOf(m.id)>=0;
    var state=ex?'exempt':dep>=q&&q>0?'paid':(p.open-q>=0?'credit':'due');
    return {m:m,state:state,dep:dep,q:q,open:p.open};
  });
}

function viewMonth(){
  var ids=S.months.map(function(m){return m.id;}).sort().reverse();
  if(!S.sel) return '<div class="card empty">لا يوجد شهر بعد.</div>';
  var c=calcOf(S.sel), mo=monthDoc(S.sel), locked=isLocked(S.sel);
  var chips='<div class="chips" role="group" aria-label="اختر الشهر">'+ids.map(function(id){var m=monthDoc(id);return '<button type="button" class="chip" data-sel="'+id+'" aria-pressed="'+(id===S.sel)+'">'+(m.closed?svg('lock'):'')+esc(shortMonth(id))+' '+id.slice(2,4)+'</button>';}).join('')+'</div>';
  var q=+mo.contribution||0;
  var qs=quickStatus(c);
  var qhtml=qs.map(function(x){
    var st=x.state==='paid'?'<span class="pill pos">'+svg('check','style="width:12px;height:12px"')+' دفع '+N(x.dep)+'</span>':x.state==='exempt'?'<span class="pill zero">معفى هذا الشهر</span>':x.state==='credit'?'<span class="pill acc">تُخصم من رصيده</span>':'<span class="pill neg">لم يدفع</span>';
    var can=!locked&&S.canWrite;
    return '<button type="button" class="q qbtn" data-qcard="'+esc(x.m.id)+'"'+(can?'':' disabled')+'><b>'+esc(x.m.name)+'</b><div class="st">'+st+'</div>'+(can?'<span class="small muted">اضغط للتعديل</span>':'')+'</button>';
  }).join('');
  var notes=mo.notes||{};
  var mcards=(S.config.members||[]).map(function(m){
    var p=c.per[m.id];if(!p)return '';
    var parts=['<b>'+SN(p.open)+'</b> البداية'];
    if(p.contrib) parts.push('− <b>'+N(p.contrib)+'</b> القطة');

    if(p.pay) parts.push('− <b>'+N(p.pay)+'</b> استلم');

    return '<div class="mcard" style="border-inline-start:4px solid '+mColor(m.id)+'"><div class="hd"><a href="#member-'+esc(m.id)+'"><b>'+esc(m.name)+'</b></a>'+balPill(p.close)+'</div><div class="formula">'+parts.join(' &nbsp;')+'</div>'+(notes[m.id]?'<div class="mnote">'+esc(notes[m.id])+'</div>':'')+'</div>';
  }).join('');

    return '<div class="sec-t"><span>'+gnames[i]+'</span><span>'+N(sum)+'</span></div>'+l.map(txRow).join('');

  var neg=c.closeAcc<0;
  return chips+

    '<div class="row">'+(mo.closed&&S.canWrite?(locked?'<button type="button" class="btn sm" id="unlockBtn">'+svg('unlock')+' فتح للتعديل</button>':'<span class="pill gold">مفتوح للتعديل مؤقتاً</span>'):'')+
    '<button type="button" class="btn sm" id="monthReport">صورة التقرير</button>'+
    (!mo.closed&&S.canWrite?'<button type="button" class="btn sm gold" id="closeBtn">إقفال الشهر وبدء التالي</button>':'')+'</div></div>'+
    '<div class="flow"><div><span>باقي الشهر الماضي</span><b>'+SN(c.openAcc)+'</b></div><div><span>دخل الحساب</span><b class="plus">+'+fmt(c.inc)+'</b></div><div><span>صرف من الحساب</span><b class="minus">−'+fmt(c.out)+'</b></div><div class="end"><span>الباقي في الحساب</span><b'+(neg?' style="color:var(--neg)"':'')+'>'+SN(c.closeAcc)+'</b></div></div>'+

    (neg?'<div class="note bad" style="margin-top:10px">رصيد الحساب أقل من صفر. لا بد من دعم قبل إقفال الشهر.</div>':'')+

  '<section class="card"><div class="card-h"><h2>الحركات</h2><span class="small muted">'+c.tx.length+' حركة · اضغط أي حركة لتعديلها</span></div><div class="txl">'+(txh||'<div class="empty">لا توجد حركات في هذا الشهر بعد. اضغط «حركة جديدة».</div>')+'</div></section>';

function viewReports(){
  var cats={},total=0;
  S.calc.forEach(function(c){Object.keys(c.byCat).forEach(function(k){cats[k]=(cats[k]||0)+c.byCat[k];total+=c.byCat[k];});});
  var arr=Object.keys(cats).map(function(k){return [k,cats[k]];}).sort(function(a,b){return b[1]-a[1];});
  var max=arr.length?arr[0][1]:1;
  var bars=arr.map(function(a){return '<div class="bc"><span>'+esc(a[0])+'</span><div class="track"><i style="width:'+(a[1]/max*100).toFixed(1)+'%"></i></div><span class="num" style="text-align:end">'+fmt(a[1])+'</span></div>';}).join('');

  var sums={d:0,e:0,x:0,p:0};S.calc.forEach(function(c){sums.d+=c.dep;sums.e+=c.ext;sums.x+=c.exp;sums.p+=c.pay;});
  return searchCard()+'<section class="card"><div class="card-h"><h2>أين ذهبت مصروفات الحساب</h2><span class="small muted">'+(S.calc.length?esc(shortMonth(S.calc[0].id))+' – '+esc(shortMonth(lastCalc().id)):'')+' · المجموع '+N(total)+'</span></div>'+
    (top?'<p class="small" style="margin:0 0 12px">أكبر بند: <b>'+esc(top[0])+'</b> بنسبة '+Math.round(top[1]/total*100)+'٪ من كل ما صُرف من الحساب.</p>':'')+
    '<div class="barchart">'+(bars||'<div class="empty">لا مصروفات بعد</div>')+'</div></section>'+
  '<section class="card"><div class="card-h"><h2>رصيد الحساب آخر كل شهر</h2></div>'+line+'</section>'+
  '<section class="card"><div class="card-h"><h2>ملخص الأشهر</h2></div><div class="tbl-wrap"><table><thead><tr><th>الشهر</th><th class="n">البداية</th><th class="n">من الأعضاء</th><th class="n">دخل خارجي</th><th class="n">مصروفات</th><th class="n">للأعضاء</th><th class="n">النهاية</th><th class="n">الصافي</th></tr></thead><tbody>'+trows+
  '<tr class="tot"><td>المجموع</td><td></td><td class="n">'+N(sums.d)+'</td><td class="n">'+N(sums.e)+'</td><td class="n">'+N(sums.x)+'</td><td class="n">'+N(sums.p)+'</td><td></td><td></td></tr></tbody></table></div></section>';
}
function lineChart(pts){
  if(pts.length<2) return '<div class="empty">يظهر الرسم بعد شهرين</div>';
  var W=640,H=220,pl=46,pr=30,pt=16,pb=28;
  var vals=pts.map(function(p){return p.v;});var mn=Math.min(0,Math.min.apply(null,vals)),mx=Math.max.apply(null,vals);
  var step=Math.pow(10,Math.floor(Math.log10(Math.max(1,mx-mn))));var top=Math.ceil(mx/step)*step||1;mn=Math.floor(mn/step)*step;
  var x=function(i){return pl+(W-pl-pr)*i/(pts.length-1);},y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/(top-mn));};
  var grid='';for(var g=0;g<=4;g++){var gv=mn+(top-mn)*g/4;grid+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(gv)+'" y2="'+y(gv)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(gv)+4)+'" text-anchor="end">'+(gv>=1000?Math.round(gv/1000)+'k':Math.round(gv))+'</text>';}
  var d=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1);}).join(' ');
  var area=d+' L'+x(pts.length-1)+' '+y(mn)+' L'+x(0)+' '+y(mn)+' Z';
  var labels=pts.map(function(p,i){return '<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.l)+'</text>';}).join('');
  var li=pts.length-1;
  return '<svg class="line" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;direction:ltr" role="img" aria-label="رصيد الحساب آخر كل شهر"><g>'+grid+'</g><path d="'+area+'" fill="var(--accent)" opacity=".10"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
  pts.map(function(p,i){return '<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(i===li?5:3)+'" fill="'+(i===li?'var(--gold)':'var(--accent)')+'"><title>'+esc(p.l)+': '+fmt(p.v)+'</title></circle>';}).join('')+
  '<text x="'+x(li)+'" y="'+(y(pts[li].v)-10)+'" text-anchor="end" style="fill:var(--ink);font-weight:600">'+fmt(pts[li].v)+'</text>'+labels+'</svg>';
}

function openSheet(html,onBind){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  document.getElementById('ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSheet();});
  m.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closeSheet);});
  if(onBind)onBind(m);
  var f=m.querySelector('input.amount,input,button');if(f&&window.innerWidth>700)f.focus();
}
function closeSheet(){document.getElementById('modal').innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}

function entrySheet(existing,preset){
  var t=existing?Object.assign({},existing):Object.assign({kind:'deposit',amount:'',note:'',month:S.sel},preset||{});
  var locked=isLocked(t.month);
  var ro=locked||!S.canWrite;
  function draw(){
    var k=KINDS[t.kind];
    var kinds=['deposit','expense','payout','onbehalf','external'].concat(t.kind==='adjust'?['adjust']:[]).map(function(kk){
      return '<button type="button" class="kind k-'+kk+'" data-kind="'+kk+'" aria-pressed="'+(t.kind===kk)+'"'+(ro?' disabled':'')+'><span class="ic">'+svg(kk)+'</span><b>'+KTXT[kk].t+'</b><span>'+KTXT[kk].s+'</span></button>';
    }).join('');
    var mems=k.needsMember?'<div><div class="small muted" style="margin-bottom:6px">العضو</div><div class="chips" style="flex-wrap:wrap">'+(S.config.members||[]).filter(function(m){return m.active!==false||m.id===t.member;}).map(function(m){return '<button type="button" class="chip" data-mem="'+esc(m.id)+'" aria-pressed="'+(t.member===m.id)+'"'+(ro?' disabled':'')+'>'+esc(m.name)+'</button>';}).join('')+'</div></div>':'';
    var cats=t.kind==='expense'?'<div><div class="small muted" style="margin-bottom:6px">البند</div><div class="chips" style="flex-wrap:wrap">'+(S.config.categories||[]).map(function(c){return '<button type="button" class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(t.category===c)+'"'+(ro?' disabled':'')+'>'+esc(c)+'</button>';}).join('')+'</div></div>':'';
    var q=+(monthDoc(t.month)||{}).contribution||1000;
    var quick=[q,q*2,500,1500].filter(function(v,i,a){return a.indexOf(v)===i;}).map(function(v){return '<button type="button" class="btn sm" data-amt="'+v+'"'+(ro?' disabled':'')+'>'+fmt(v)+'</button>';}).join('');
    var fixedBox=(t.kind==='onbehalf'||t.kind==='payout'||t.kind==='expense')?'<label class="check"><input type="checkbox" id="eFixed"'+(t.fixed?' checked':'')+(ro?' disabled':'')+'> يتكرر كل شهر (ينسخ تلقائياً للشهر الجديد)</label>':'';
    var effect=effectText(t);
    var by=existing&&existing.by&&S.names[existing.by]?'<div class="small muted">أضافها: '+esc(S.names[existing.by])+'</div>':'';
    return '<div class="sheet-h"><h2>'+(existing?'تفاصيل الحركة':'حركة جديدة')+' · '+esc(shortMonth(t.month))+'</h2><button type="button" class="x" data-close aria-label="إغلاق">×</button></div>'+
      (locked?'<div class="note">هذا الشهر مقفل. افتحه للتعديل من صفحة الشهر.</div>':'')+
      '<div class="kinds">'+kinds+'</div>'+mems+
      '<label class="f">المبلغ (ريال)<input type="number" inputmode="decimal" id="eAmt" class="amount" value="'+esc(t.kind==='adjust'?t.amount:(t.amount===''?'':Math.abs(t.amount)))+'" placeholder="0"'+(ro?' disabled':'')+'></label><div class="row">'+quick+'</div>'+
      cats+'<label class="f">ملاحظة<input type="text" id="eNote" value="'+esc(t.note||'')+'" placeholder="مثال: تسديد دين، كهرباء البيت القديم"'+(ro?' disabled':'')+'></label>'+fixedBox+
      '<div class="note good small" id="eEffect">'+effect+'</div>'+by+
      '<div id="eErr"></div>'+
      (ro?'':'<div class="row"><button type="button" class="btn pri" id="eSave" style="flex:1">'+(existing?'حفظ التعديل':'حفظ')+'</button>'+(existing?'<button type="button" class="btn danger" id="eDel">حذف</button>':'')+'</div>');
  }
  function bind(m){
    m.querySelectorAll('[data-kind]').forEach(function(b){b.addEventListener('click',function(){grab();t.kind=b.getAttribute('data-kind');if(!KINDS[t.kind].needsMember)delete t.member;redraw();});});
    m.querySelectorAll('[data-mem]').forEach(function(b){b.addEventListener('click',function(){grab();t.member=b.getAttribute('data-mem');redraw();});});
    m.querySelectorAll('[data-cat]').forEach(function(b){b.addEventListener('click',function(){grab();t.category=b.getAttribute('data-cat');redraw();});});
    m.querySelectorAll('[data-amt]').forEach(function(b){b.addEventListener('click',function(){grab();t.amount=+b.getAttribute('data-amt');redraw();});});
    var a=m.querySelector('#eAmt');if(a)a.addEventListener('input',function(){grab();m.querySelector('#eEffect').innerHTML=effectText(t);});
    var s=m.querySelector('#eSave');if(s)s.addEventListener('click',save);
    var d=m.querySelector('#eDel');if(d)d.addEventListener('click',function(){
      if(d.getAttribute('data-sure')){d.disabled=true;S.db.collection('tx').doc(existing.id).delete().then(function(){closeSheet();toast('تم حذف الحركة');}).catch(err);}
      else{d.setAttribute('data-sure','1');d.textContent='اضغط مرة أخرى للتأكيد';}
    });
  }
  function grab(){
    var m=document.getElementById('modal');
    var a=m.querySelector('#eAmt');if(a)t.amount=a.value===''?'':+a.value;
    var n=m.querySelector('#eNote');if(n)t.note=n.value;
    var f=m.querySelector('#eFixed');if(f)t.fixed=f.checked;
  }
  function redraw(){var m=document.getElementById('modal');m.querySelector('.sheet').innerHTML=draw();m.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closeSheet);});bind(m);}
  function err(e){var el=document.getElementById('eErr');if(el)el.innerHTML='<div class="note bad">تعذّر الحفظ: '+esc(errMsg(e))+'</div>';var s=document.getElementById('eSave');if(s)s.disabled=false;}
  function save(){
    grab();
    var e=[];
    var amt=+t.amount;
    if(!amt||(t.kind!=='adjust'&&amt<=0)) e.push('اكتب المبلغ');
    if(KINDS[t.kind].needsMember&&!t.member) e.push('اختر العضو');
    if(t.kind==='expense'&&!t.category) e.push('اختر البند');
    if(e.length){document.getElementById('eErr').innerHTML='<div class="note bad">'+e.join(' · ')+'</div>';return;}
    var doc={month:t.month,kind:t.kind,amount:t.kind==='adjust'?r2(amt):r2(Math.abs(amt)),note:(t.note||'').trim(),seq:existing?existing.seq:Date.now(),createdAt:existing?existing.createdAt:new Date().toISOString()};
    if(KINDS[t.kind].needsMember) doc.member=t.member;
    if(t.kind==='expense') doc.category=t.category;
    if(t.fixed&&(t.kind==='onbehalf'||t.kind==='payout'||t.kind==='expense')) doc.fixed=true;
    doc.by=existing&&existing.by?existing.by:(S.uid||'');
    document.getElementById('eSave').disabled=true;
    var ref=existing?S.db.collection('tx').doc(existing.id):S.db.collection('tx').doc();
    ref.set(doc).then(function(){closeSheet();toast(existing?'تم حفظ التعديل':'تمت الإضافة');}).catch(err);
  }
  openSheet(draw(),bind);
}
function effectText(t){
  var a=Math.abs(+t.amount||0), m=t.member?member(t.member).name:'العضو', A='<b class="num">'+fmt(a)+'</b>';
  switch(t.kind){
    case 'deposit':return 'يزيد رصيد الحساب '+A+' ويُضاف لرصيد '+esc(m)+'.';
    case 'expense':return 'يُخصم '+A+' من رصيد حساب الجمعية.';
    case 'payout':return 'يُخصم '+A+' من الحساب ومن رصيد '+esc(m)+' (يصير عليه أو تنقص مستحقاته).';
    case 'onbehalf':return 'لا يمس الحساب. يُضاف '+A+' لرصيد '+esc(m)+' لأنه دفع عن الجمعية.';
    case 'external':return 'يزيد رصيد الحساب '+A+' ولا يمس أرصدة الأعضاء.';
    case 'adjust':return 'يغيّر رصيد '+esc(m)+' فقط بمقدار '+A+'.';
  }
  return '';
}
function errMsg(e){
  var c=e&&e.code;
  if(c==='invalid_argument') return 'لا تملك صلاحية التعديل في هذا التطبيق.';
  if(c==='quota_exceeded') return 'امتلأت مساحة البيانات.';
  if(c==='resource_exhausted') return 'محاولات كثيرة متتالية، انتظر قليلاً ثم أعد المحاولة.';
  return 'تحقق من الاتصال ثم أعد المحاولة.';
}

function closeMonthSheet(){
  var c=calcOf(S.sel), mo=monthDoc(S.sel), nextId=monthAfter(S.sel);
  if(monthDoc(nextId)){toast('الشهر التالي موجود مسبقاً');return;}
  var fixed=c.tx.filter(function(t){return t.fixed;});
  var unpaid=quickStatus(c).filter(function(x){return x.state==='due';});
  var neg=c.closeAcc<0;
  var html='<div class="sheet-h"><h2>إقفال '+esc(mo.label||monthLabel(S.sel))+'</h2><button type="button" class="x" data-close aria-label="إغلاق">×</button></div>'+
    (neg?'<div class="note bad">لا يمكن الإقفال: رصيد الحساب '+SN(c.closeAcc)+' أقل من صفر. لا بد من دعم أولاً.</div>':
    '<div class="flow"><div><span>ينتقل للحساب</span><b>'+SN(c.closeAcc)+'</b></div><div><span>ديون على الأعضاء</span><b>'+N(c.owedBy)+'</b></div><div><span>مستحقات لهم</span><b>'+N(c.owedTo)+'</b></div><div class="end"><span>الشهر الجديد</span><b style="font-size:14px">'+esc(shortMonth(nextId))+'</b></div></div>'+
    (unpaid.length?'<div class="note">لم تُسجَّل قطة: '+esc(unpaid.map(function(x){return x.m.name;}).join('، '))+'. ستُحسب عليهم ديناً.</div>':'')+
    (fixed.length?'<label class="check"><input type="checkbox" id="copyFixed" checked> انسخ الحركات المتكررة للشهر الجديد ('+fixed.map(function(t){return esc(t.member?member(t.member).name:t.category)+' '+fmt(t.amount);}).join('، ')+')</label>':'')+
    '<div class="small muted">الأرصدة تنتقل تلقائياً. لو عدّلت هذا الشهر لاحقاً تتصحح الأشهر التي بعده وحدها.</div>'+
    '<div id="cErr"></div><button type="button" class="btn gold block" id="cGo">إقفال وبدء '+esc(monthLabel(nextId))+'</button>');
  openSheet(html,function(m){
    var go=m.querySelector('#cGo');if(!go)return;
    go.addEventListener('click',function(){
      go.disabled=true;
      var cp=m.querySelector('#copyFixed');var copy=cp?cp.checked:false;
      S.db.collection('months').doc(nextId).set({id:nextId,label:monthLabel(nextId),contribution:+mo.contribution||0,closed:false,notes:{}})
      .then(function(){return S.db.collection('months').doc(S.sel).update({closed:true});})
      .then(function(){
        if(!copy)return;
        var p=Promise.resolve();var base=Date.now();
        fixed.forEach(function(t,i){p=p.then(function(){var d={month:nextId,kind:t.kind,amount:t.amount,note:t.note||'',seq:base+i,createdAt:new Date().toISOString(),fixed:true,by:S.uid||''};if(t.member)d.member=t.member;if(t.category)d.category=t.category;return S.db.collection('tx').doc().set(d);});});
        return p;
      })
      .then(function(){S.sel=nextId;closeSheet();toast('بدأ '+monthLabel(nextId));})
      .catch(function(e){go.disabled=false;m.querySelector('#cErr').innerHTML='<div class="note bad">'+esc(errMsg(e))+'</div>';});
    });
  });
}


function quickSheet(mid){

function buildWorkbook(X){

  var ws=X.utils.aoa_to_sheet(sum);ws['!cols']=[{wch:24},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12}];X.utils.book_append_sheet(wb,ws,'الملخص');
  S.calc.slice().reverse().forEach(function(c){
    var mo=monthDoc(c.id)||{};var notes=mo.notes||{};
    var a=[[mo.label||monthLabel(c.id)],['القطة',+mo.contribution||0],[],['العضو','الرصيد السابق','القطة','حوّل للحساب','دفع نيابة','استلم من الحساب','تسوية','الرصيد الجديد','الصفة','ملاحظة']];
    (S.config.members||[]).forEach(function(m){var p=c.per[m.id];if(!p)return;a.push([m.name,p.open,p.contrib,p.dep,p.onb,p.pay,p.adj,p.close,p.close>0?'دائن':p.close<0?'مدين':'—',notes[m.id]||'']);});
    a.push([],['حساب الجمعية'],['باقي الشهر الماضي',c.openAcc],['دخل من الأعضاء',c.dep],['دخل خارجي',c.ext],['مصروفات الحساب',c.exp],['محوّل للأعضاء',c.pay],['الباقي في الحساب',c.closeAcc],['المفترض (الصافي)',c.net],[],['الحركات'],['النوع','العضو / البند','المبلغ','ملاحظة']);
    c.tx.forEach(function(t){a.push([KTXT[t.kind]?KTXT[t.kind].short:t.kind,t.member?member(t.member).name:(t.category||''),t.amount,t.note||'']);});
    var s=X.utils.aoa_to_sheet(a);s['!cols']=[{wch:22},{wch:16},{wch:12},{wch:13},{wch:12},{wch:15},{wch:10},{wch:14},{wch:8},{wch:34}];
    X.utils.book_append_sheet(wb,s,(shortMonth(c.id)+' '+c.id.slice(0,4)).slice(0,31));
  });
  // ورقة مخفية فيها كل البيانات كما هي، لاسترجاعها في التطبيق
  var payload=JSON.stringify({app:'jamiya-albait',v:1,savedAt:new Date().toISOString(),config:S.config,months:S.months,tx:S.tx});
  var rows=[['لا تعدّل هذه الورقة: فيها النسخة الاحتياطية للتطبيق']];for(var i=0;i<payload.length;i+=30000)rows.push([payload.slice(i,i+30000)]);
  X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),'backup');
  wb.Workbook={Views:[{RTL:true}],Sheets:wb.SheetNames.map(function(n){return {Hidden:n==='backup'?1:0};})};
  return wb;
}

function X_rows(sh){var X=window.XLSX;return X.utils.sheet_to_json(sh,{header:1,raw:true,defval:''}).map(function(r){return String(r[0]||'');});}
function clean(o){var c=Object.assign({},o);delete c.id;return c;}
function doRestore(data,btn){
  var ops=[];
  ops.push(function(){return S.db.doc('config/main').set(clean(data.config));});
  var keepM={},keepT={};
  data.months.forEach(function(m){keepM[m.id]=1;ops.push(function(){var c=clean(m);c.id=m.id;return S.db.collection('months').doc(m.id).set(c);});});
  data.tx.forEach(function(t){keepT[t.id]=1;ops.push(function(){return S.db.collection('tx').doc(t.id).set(clean(t));});});
  S.months.forEach(function(m){if(!keepM[m.id])ops.push(function(){return S.db.collection('months').doc(m.id).delete();});});
  S.tx.forEach(function(t){if(!keepT[t.id])ops.push(function(){return S.db.collection('tx').doc(t.id).delete();});});
  var i=0,n=ops.length;
  function next(){
    if(i>=n){btn.textContent='تم الاسترجاع';toast('تم استرجاع النسخة');return;}
    btn.textContent='جارٍ الاسترجاع… '+i+' من '+n;
    ops[i]().then(function(){i++;setTimeout(next,60);},function(e){
      if(e&&e.code==='resource_exhausted'){setTimeout(next,2000);return;}
      btn.disabled=false;btn.textContent='أكمل الاسترجاع';btn.onclick=function(){btn.disabled=true;btn.onclick=null;next();};toast(errMsg(e));
    });
  }
  next();
}

var countedOnce=false;
function countUp(){
  if(countedOnce)return;countedOnce=true;
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  document.querySelectorAll('[data-count]').forEach(function(el){
    var target=+el.getAttribute('data-count');if(!isFinite(target)||Math.abs(target)<10)return;
    var t0=performance.now(),dur=900;
    function step(t){var k=Math.min(1,(t-t0)/dur);var e=1-Math.pow(1-k,3);el.textContent=(target<0?'−':'')+fmt(Math.abs(target)*e);if(k<1)requestAnimationFrame(step);else el.textContent=(target<0?'−':'')+fmt(Math.abs(target));}
    requestAnimationFrame(step);
  });
}

function planOf(id){return ((S.config&&S.config.plans)||{})[id]||null;}
function planInfo(id){
  var pl=planOf(id);if(!pl||!(pl.monthly>0))return null;
  var rows=S.calc.filter(function(c){return c.id>=pl.start&&c.per[id];});
  if(!rows.length)return null;
  var startDebt=Math.max(0,-rows[0].per[id].open);
  var last=lastCalc();var cur=last.per[id]?last.per[id].close:0;var debt=Math.max(0,-cur);
  var paid=Math.max(0,startDebt-debt);
  var hist=rows.map(function(c){var p=c.per[id];var red=r2(p.close-p.open);var closed=!!(monthDoc(c.id)||{}).closed;return {id:c.id,red:red,ok:red>=pl.monthly-0.005,closed:closed};});
  var late=hist.filter(function(h){return h.closed&&!h.ok;});
  var left=debt>0?Math.ceil(debt/pl.monthly):0;
  var endId=last.id;for(var i=0;i<left;i++)endId=monthAfter(endId);
  return {pl:pl,startDebt:startDebt,debt:debt,paid:paid,pct:startDebt?Math.min(100,paid/startDebt*100):100,hist:hist,late:late,left:left,endId:endId};
}

      (S.canWrite?'<div class="row"><input type="number" inputmode="decimal" id="planAmt" placeholder="القسط الشهري" style="flex:1"><button type="button" class="btn pri" id="planSave">ابدأ الخطة من '+esc(shortMonth(S.sel||last.id))+'</button></div>':'');
  } else {
    var c=mColor(id);

function reportCanvas(id,showBal){

  var H=640+Math.ceil(qs.length/2)*86+ (cats.length?110+cats.length*62:0) + (showBal&&ms.length?110+ms.length*62:0) + 90;

  x.fillStyle='#fff';x.textAlign='right';
  x.font='600 44px '+D;x.fillText('جمعية البيت',W-90,120);

  x.font='400 28px '+F;x.globalAlpha=.85;x.fillText('رصيد حساب الجمعية',W-90,250);x.globalAlpha=1;
  x.font='600 96px '+F;x.fillText(fmt(c.closeAcc)+' ريال',W-90,350);
  var st=[['دخل الحساب','+'+fmt(c.inc)],['صرف من الحساب','−'+fmt(c.out)],['الصافي بعد التسوية',(c.net<0?'−':'')+fmt(c.net)]];
  var bw=(W-80-100-40)/3;
  st.forEach(function(s,i){var bx=W-90-bw-i*(bw+20);x.fillStyle='rgba(255,255,255,.13)';rr(x,bx,390,bw,96,18);x.fill();x.fillStyle='#fff';x.globalAlpha=.85;x.font='400 24px '+F;x.fillText(s[0],bx+bw-20,428);x.globalAlpha=1;x.font='600 34px '+F;x.fillText(s[1],bx+bw-20,472);});
  var y=580;
  function head(t){x.fillStyle='#15242A';x.font='600 36px '+D;x.textAlign='right';x.fillText(t,W-60,y);y+=30;}
  head('القطة '+fmt(q)+' ريال');
  var cw=(W-120-20)/2;
  qs.forEach(function(s,i){var col=i%2,row=Math.floor(i/2);var bx=W-60-cw-col*(cw+20),by=y+row*86;
    x.fillStyle='#fff';rr(x,bx,by,cw,70,16);x.fill();
    var mc=mColor(s.m.id);x.fillStyle=mc;rr(x,bx+cw-10,by+14,6,42,3);x.fill();
    x.fillStyle='#15242A';x.font='500 30px '+F;x.textAlign='right';x.fillText(s.m.name,bx+cw-30,by+46);
    var lab=s.state==='paid'?'✓ دفع '+fmt(s.dep):s.state==='exempt'?'معفى':s.state==='credit'?'من رصيده':'لم يدفع';
    x.fillStyle=s.state==='paid'?'#1D7A47':s.state==='due'?'#B23A30':'#5D6B6F';x.font='500 26px '+F;x.textAlign='left';x.fillText(lab,bx+24,by+45);
  });
  y+=Math.ceil(qs.length/2)*86+60;
  if(cats.length){head('أهم المصروفات');y+=10;var mx=cats[0][1];
    cats.forEach(function(a){x.fillStyle='#15242A';x.font='400 28px '+F;x.textAlign='right';x.fillText(a[0],W-60,y+30);x.textAlign='left';x.font='600 28px '+F;x.fillText(fmt(a[1]),60,y+30);
      var bw2=(W-560)*a[1]/mx;x.fillStyle='#DCE3DE';rr(x,200,y+12,W-560,22,11);x.fill();x.fillStyle='#0D6655';rr(x,200+(W-560)-bw2,y+12,bw2,22,11);x.fill();y+=62;});
    y+=40;}
  if(showBal&&ms.length){head('أرصدة الأعضاء');y+=10;
    ms.forEach(function(m){var v=c.per[m.id].close;x.fillStyle='#15242A';x.font='400 28px '+F;x.textAlign='right';x.fillText(m.name,W-60,y+30);x.textAlign='left';x.font='600 28px '+F;x.fillStyle=v>0?'#1D7A47':'#B23A30';x.fillText((v>0?'له ':'عليه ')+fmt(Math.abs(v)),60,y+30);y+=62;});

  void css;return cv;

var Store=(function(){

  var st=null;try{st=JSON.parse(localStorage.getItem(K));}catch(e){}
  if(!st||!st.dev) st={dev:rid(),name:'',recs:{},vv:{},peers:{},setup:false,pw:'',lastId:'',seen:[],outbox:[],sentUpTo:0,batches:{},lastRx:0,lastTx:0};
  ['recs','vv','peers','batches'].forEach(function(k){if(!st[k])st[k]={};});
  ['seen','outbox'].forEach(function(k){if(!st[k])st[k]=[];});
  var saveT=0,listeners=[];
  function saveNow(){saveT=0;try{localStorage.setItem(K,JSON.stringify(st));}catch(e){toast('تعذّر الحفظ على الجهاز: المساحة ممتلئة');}}
  function save(){if(!saveT)saveT=setTimeout(saveNow,150);}
  window.addEventListener('pagehide',function(){if(saveT){clearTimeout(saveT);saveNow();}});
  function changed(){save();listeners.forEach(function(f){f();});}
  function nextU(id){var cur=st.recs[id];return Math.max(Date.now(),(cur?cur.u:0)+1,(st.vv[st.dev]||0)+1);}

    if(typeof undoCapture==='function')undoCapture(id,st.recs[id]);
    var u=nextU(id);var rec={d:data||null,u:u,o:st.dev};if(!data)rec.del=true;
    st.recs[id]=rec;st.vv[st.dev]=u;changed();Sync.scheduleOwn();
  }
  function merge(id,rec){
    if(!rec||typeof rec.u!=='number'||!rec.o)return false;
    if(!/^(config\/main|months\/[\w-]+|tx\/[\w-]+)$/.test(id))return false;
    var cur=st.recs[id];
    if(!cur||rec.u>cur.u||(rec.u===cur.u&&rec.o>cur.o)){st.recs[id]=rec;return true;}
    return false;
  }
  function view(){
    var c=st.recs['config/main'];var config=c&&!c.del?c.d:null;var months=[],tx=[];
    Object.keys(st.recs).forEach(function(id){var r=st.recs[id];if(r.del||!r.d)return;
      if(id.indexOf('months/')===0){var m=Object.assign({},r.d);m.id=id.slice(7);months.push(m);}
      else if(id.indexOf('tx/')===0){var t=Object.assign({},r.d);t.id=id.slice(3);tx.push(t);}});
    return {config:config,months:months,tx:tx};
  }
  function ref(path){
    return {id:path.split('/').pop(),path:path,
      set:function(d){write(path,JSON.parse(JSON.stringify(d)));return Promise.resolve();},
      update:function(d){var cur=st.recs[path];if(!cur||cur.del)return Promise.reject({code:'invalid_argument'});write(path,Object.assign({},cur.d,JSON.parse(JSON.stringify(d))));return Promise.resolve();},
      delete:function(){if(st.recs[path]&&!st.recs[path].del)write(path,null);return Promise.resolve();}};
  }
  var db={doc:function(p){return ref(p);},collection:function(c){return {doc:function(id){return ref(c+'/'+(id||rid()));}};}};
  // استيراد ملف البيانات الأصلي (نفس الأصل والنسخة على كل جهاز، فلا يتكرر)
  function importSeed(data){
    var put=function(id,d){merge(id,{d:d,u:1,o:'xl'});};
    put('config/main',data.config);
    data.months.forEach(function(m){var x=Object.assign({},m);delete x.id;x.id=m.id;put('months/'+m.id,x);});
    data.tx.forEach(function(t){var x=Object.assign({},t);delete x.id;put('tx/'+t.id,x);});
    st.vv.xl=Math.max(st.vv.xl||0,1);changed();
  }
  return {st:st,db:db,write:write,merge:merge,view:view,changed:changed,save:save,saveNow:saveNow,importSeed:importSeed,rid:rid,on:function(f){listeners.push(f);}};
})();

var Undo={g:null,t:0,silent:false};

  if(Undo.silent)return;
  if(!Undo.g)Undo.g={};

}
function undoToast(g){
  var old=document.getElementById('undoBar');if(old)old.remove();
  var d=document.createElement('div');d.id='undoBar';d.className='toast';d.style.cssText+=';display:flex;gap:14px;align-items:center;bottom:96px';
  d.innerHTML='<span>تم الحفظ</span><button type="button" class="btn sm" style="background:transparent;color:inherit;border-color:currentColor">تراجع</button>';
  document.body.appendChild(d);
  var tm=setTimeout(function(){d.remove();},7000);
  d.querySelector('button').addEventListener('click',function(){
    clearTimeout(tm);d.remove();Undo.silent=true;
    try{Object.keys(g).forEach(function(id){Store.write(id,g[id]);});}finally{Undo.silent=false;}
    toast('تم التراجع');
  });
}
// يُخفي رسائل «تمت الإضافة» العادية لأن شريط التراجع يقوم مقامها
var _toast=toast;toast=function(t){if(/^(تمت الإضافة|تم حفظ التعديل|تم حذف الحركة|سُجّلت القطة|سُجّلت قطة)/.test(t)&&Undo.g!==undefined)return;_toast(t);};

// ===== القفل برمز =====
async function pinHash(pin,salt){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+pin));return [].map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
var Lock={on:false,entry:''};
function showLock(){
  var st=Store.st;if(!st.pinHash||Lock.on)return;Lock.on=true;Lock.entry='';
  var d=document.createElement('div');d.id='lockScr';
  d.style.cssText='position:fixed;inset:0;z-index:100;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:24px';
  var keys=[1,2,3,4,5,6,7,8,9,'',0,'⌫'];
  d.innerHTML='<div style="display:grid;gap:18px;justify-items:center;width:100%;max-width:300px"><div class="logo" style="background:rgba(255,255,255,.15);width:56px;height:56px;font-size:28px">ج</div><h2 style="color:inherit">أدخل الرمز</h2><div id="lkDots" style="display:flex;gap:12px;direction:ltr"></div><div id="lkMsg" class="small" style="min-height:20px;opacity:.9"></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;direction:ltr">'+keys.map(function(k){return k===''?'<span></span>':'<button type="button" data-k="'+k+'" style="height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:inherit;font-size:24px;font-family:var(--font-body);cursor:pointer">'+k+'</button>';}).join('')+'</div>'+
    '<button type="button" id="lkForgot" style="background:none;border:0;color:inherit;opacity:.85;text-decoration:underline;cursor:pointer;font:inherit">نسيت الرمز؟</button></div>';
  document.body.appendChild(d);
  function dots(){var n=st.pinLen||4;var h='';for(var i=0;i<n;i++)h+='<span style="width:14px;height:14px;border-radius:50%;border:2px solid currentColor;'+(i<Lock.entry.length?'background:currentColor':'')+'"></span>';d.querySelector('#lkDots').innerHTML=h;}
  dots();
  async function press(k){
    if(k==='⌫'){Lock.entry=Lock.entry.slice(0,-1);dots();return;}
    if(Lock.entry.length>=(st.pinLen||4))return;Lock.entry+=k;dots();
    if(Lock.entry.length===(st.pinLen||4)){
      if(await pinHash(Lock.entry,st.pinSalt)===st.pinHash){d.remove();Lock.on=false;}
      else{d.querySelector('#lkMsg').textContent='رمز خاطئ';Lock.entry='';setTimeout(dots,250);}
    }
  }
  d.querySelectorAll('[data-k]').forEach(function(b){b.addEventListener('click',function(){press(b.getAttribute('data-k'));});});
  d.addEventListener('keydown',function(e){if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');});
  document.addEventListener('keydown',function kh(e){if(!Lock.on){document.removeEventListener('keydown',kh);return;}if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');});
  d.querySelector('#lkForgot').addEventListener('click',function(){
    var box=d.querySelector('#lkMsg');box.innerHTML='<div style="display:grid;gap:8px;margin-top:6px"><span>اكتب كلمة سر العائلة لفتح التطبيق وإلغاء الرمز</span><input type="text" id="lkPw" dir="auto" style="background:rgba(255,255,255,.95);color:#15242A"><button type="button" id="lkPwGo" class="btn" style="background:#fff;color:#0D6655">فتح</button></div>';
    box.querySelector('#lkPwGo').addEventListener('click',function(){
      if(st.pw&&box.querySelector('#lkPw').value.trim()===st.pw){st.pinHash='';st.pinSalt='';Store.saveNow();d.remove();Lock.on=false;toast('أُلغي الرمز، تقدر تضبط رمزاً جديداً من «أدوات»');render();}
      else box.querySelector('#lkPw').style.outline='2px solid #F07D72';
    });
  });
}
function pinCard(){
  var st=Store.st;
  return '<section class="card" style="display:grid;gap:10px"><div><h2>قفل التطبيق برمز</h2><div class="small muted">يُطلب الرمز عند فتح التطبيق وبعد تركه دقيقة. خاص بهذا الجهاز فقط.</div></div>'+
   (!st.pw?'<div class="note small">فعّل المزامنة بكلمة سر العائلة أولاً، لأنها طريقة فتح التطبيق لو نسيت الرمز.</div>':
   (st.pinHash?'<div class="row"><span class="pill pos">القفل مفعّل</span><button type="button" class="btn sm" id="pinChange">تغيير الرمز</button><button type="button" class="btn sm danger" id="pinOff">إلغاء القفل</button></div>':'<div class="row"><input type="password" inputmode="numeric" id="pinNew" maxlength="6" placeholder="رمز من 4 إلى 6 أرقام" style="flex:1;direction:ltr;text-align:center"><button type="button" class="btn pri" id="pinSet">تفعيل</button></div>'))+'</section>';
}
function bindPinCard(){
  var st=Store.st;
  var set=document.getElementById('pinSet');
  if(set)set.addEventListener('click',async function(){var v=document.getElementById('pinNew').value.trim();if(!/^\d{4,6}$/.test(v)){toast('الرمز من 4 إلى 6 أرقام');return;}st.pinSalt=Store.rid();st.pinLen=v.length;st.pinHash=await pinHash(v,st.pinSalt);Store.saveNow();toast('فُعّل القفل');render();});
  var off=document.getElementById('pinOff');if(off)off.addEventListener('click',function(){st.pinHash='';st.pinSalt='';Store.saveNow();toast('أُلغي القفل');render();});
  var ch=document.getElementById('pinChange');if(ch)ch.addEventListener('click',function(){st.pinHash='';Store.saveNow();render();});
}
var hiddenLockAt=0;
document.addEventListener('visibilitychange',function(){if(document.hidden)hiddenLockAt=Date.now();else if(Store.st.pinHash&&Date.now()-hiddenLockAt>60000)showLock();});
if(Store.st.pinHash)showLock();

})();
</script>
</body>
